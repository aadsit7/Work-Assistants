/* =================================================================
   AMBIENT — always-on listening that answers questions it overhears.

   MICROPHONE ONLY, on purpose: computer-audio capture and local
   Whisper both need COOP/COEP isolation headers that GitHub Pages
   cannot set, so the only capture path is the same Web Speech engine
   dictation uses. Off by default; one click arms it.

   Pipeline: final fragments (each the best of the engine's N
   alternatives, scored against the persona's vocabulary) accumulate
   in a buffer (EchoGuard drops anything that is our own TTS; while
   our TTS actually plays the recogniser is paused outright — see
   Speech). The buffer flushes after 1400ms of silence — 900ms when
   it already reads as a complete question — or immediately once it
   hits the run-on cap. Fragments under 6 chars or 2 words are
   ignored. A flushed utterance gets the persona's vocabulary fixes,
   is deduped against the last 8 seconds, and then queues for the
   classifier gate: one cheap-model call (action "classify")
   returning needs_answer / normalized_question / confidence / topic
   / reason, scoped by the persona's Task and Context and instructed
   to err toward answering. The engine's transcript confidence rides
   along: at or above 0.6 (or unknown) the classifier bar stays at
   0.45, and below that it rises — a garbled utterance must clear a
   higher bar before it may auto-answer. Accepted questions go
   through the normal answer pipeline (full brief, search retry
   chain) with channel "voice" and the TRANSCRIPT confidence logged
   to the Messages tab, and the reply is spoken.

   THIS MUST NEVER GET STUCK: the classifier call is bounded at 15s
   and each answer attempt at CHAT_TIMEOUT_MS; a 4-second watchdog
   resets any stage that outlives its ceiling. The answer ceiling
   deliberately exceeds the SUM of the full retry chain (2 ×
   CHAT_TIMEOUT_MS), not one call — a tighter ceiling would abort
   legitimate retries on slow networks. Every heard question ends in
   the decision log as answered, rejected, duplicate, dropped, or
   failed — an answer or a visible failure, never silence.

   AND THE MICROPHONE MUST NEVER DIE SILENTLY: Chrome's recogniser
   stops on long silence, network blips, and backgrounded tabs —
   sometimes without ever firing an event. The same watchdog tick
   also checks engine health: a session that never signals start
   within 6s is aborted (the dead instance is discarded — every
   restart constructs a fresh recogniser, never re-starts a wedged
   object) and a missing session with no restart scheduled gets one.
   Consecutive failures count as strikes; at three the band shows a
   visible "Not hearing" state while retries continue at a slower
   cadence, and any successful audio clears it.
================================================================= */
const AMBIENT = {
  FLUSH_MS: 1400, FLUSH_QUESTION_MS: 900,
  MIN_CHARS: 6, MIN_WORDS: 2, BUFFER_CAP: 360,
  DEDUPE_MS: 8000, QUEUE_CAP: 5, CONF_MIN: 0.45,
  CLASSIFY_TIMEOUT_MS: 15000, LOG_KEEP: 12
};
const QUESTION_OPENER = /^(who|what|when|where|why|how|which|is|are|was|were|am|do|does|did|can|could|should|would|will|shall|have|has|tell me|walk me|give me|explain)\b/i;
function looksLikeQuestion(t){
  const s = t.trim();
  if(/\?\s*$/.test(s)) return true;
  return QUESTION_OPENER.test(s) && s.split(/\s+/).length >= 4;
}
/* transcript confidence gates the classifier: a clean transcript (≥0.6, or
   none reported) keeps the 0.45 bar; a garbled one must clear a higher bar
   before it may auto-answer, up to 0.85 */
function ambientRequiredConf(tconf){
  if(typeof tconf !== "number" || tconf >= 0.6) return AMBIENT.CONF_MIN;
  return Math.min(0.85, AMBIENT.CONF_MIN + (0.6 - tconf) * 0.75);
}
const Ambient = {
  armed:false, paused:false, ttsHold:false, _ttsTimer:null, session:null,
  buffer:"", interim:"", bufChars:0, bufWeighted:0,
  flushTimer:null, restartTimer:null, lastStart:0,
  strikes:0, stalled:false, _expectStop:false,
  stage:"listening", stageAt:0, stageText:"", stageCtl:null, current:null, _wd:false,
  queue:[], busy:false, recent:[], decisions:[], watchdog:null,
  /* tunable, not const: the watchdog geometry is part of the behavior */
  WATCH_TICK_MS: 4000,
  CLASSIFY_CEILING_MS: 20000,     // one 15s classifier call + margin
  ANSWER_CEILING_MS: 100000,      // > 2 × CHAT_TIMEOUT_MS: the whole retry chain + margin
  START_WEDGE_MS: 6000,           // a session with no start signal after this is dead
  TTS_RESUME_MS: 600,             // gap between our speech ending and listening again
  supported(){ return SPEECH_ENGINES.browser_native.supported(); },
  arm(){
    if(this.armed || !this.supported()) return;
    if(!getToken()){ micNotice("Ambient listening needs the access token — add it in Settings › Chat."); return; }
    if(VoiceTest.running){ micNotice("The voice accuracy test is using the microphone — stop it first."); return; }
    if(Dictation.active) discardDictation();
    this.armed = true; this.paused = false; this.ttsHold = false;
    this.strikes = 0; this.stalled = false;
    VoiceState.set("listening", selectedId);
    this.setStage("listening");
    this.startListening();
    clearInterval(this.watchdog);
    this.watchdog = setInterval(() => this.tick(), this.WATCH_TICK_MS);
    refreshAmbient();
  },
  disarm(msg){
    this.armed = false; this.paused = false; this.ttsHold = false;
    this.strikes = 0; this.stalled = false; this._expectStop = false;
    VoiceState.clear("listening");
    this.stopListening();
    clearTimeout(this.flushTimer); this.flushTimer = null;
    clearTimeout(this.restartTimer); this.restartTimer = null;
    clearTimeout(this._ttsTimer); this._ttsTimer = null;
    clearInterval(this.watchdog); this.watchdog = null;
    if(this.stageCtl){ try{ this.stageCtl.abort(); }catch(e){} this.stageCtl = null; }
    this.buffer = ""; this.interim = ""; this.bufChars = 0; this.bufWeighted = 0;
    this.queue.length = 0; this.busy = false; this.current = null;
    this.setStage("listening");
    if(msg) micNotice(msg);
    refreshAmbient();
  },
  /* dictation, our own TTS, and ambient share the one microphone slot */
  pauseForDictation(){
    if(!this.armed || this.paused) return;
    this.paused = true;
    this.stopListening();
    renderAmbient();
  },
  resumeAfterDictation(){
    if(!this.armed || !this.paused) return;
    this.paused = false;
    if(!this.ttsHold) this.startListening();
    renderAmbient();
  },
  /* while we speak, don't listen at all — the recogniser must never hear our
     own voice. Resume trails the last utterance by TTS_RESUME_MS so the tail
     of the audio can't leak in; EchoGuard remains the second line. */
  pauseForSpeech(){
    if(!this.armed) return;
    /* always cancel a pending resume — back-to-back replies must not let the
       old resume timer re-open the microphone mid-speech */
    clearTimeout(this._ttsTimer); this._ttsTimer = null;
    if(this.ttsHold) return;
    this.ttsHold = true;
    this.stopListening();
    renderAmbient();
  },
  resumeAfterSpeech(){
    if(!this.armed || !this.ttsHold) return;
    clearTimeout(this._ttsTimer);
    this._ttsTimer = setTimeout(() => {
      this.ttsHold = false;
      if(!this.paused) this.startListening();
      renderAmbient();
    }, this.TTS_RESUME_MS);
  },
  held(){ return this.paused || this.ttsHold; },
  /* persona switched: next session picks up the new dictation language */
  refreshLang(){
    if(this.armed && !this.held() && this.session) this.stopListening();  // onEnd restarts
  },
  startListening(){
    if(!this.armed || this.held() || this.session) return;
    const r = roleById(selectedId);
    const lang = (r && String(r.language || "").trim()) || "en-US";
    this.lastStart = Date.now();
    try{
      this.session = SPEECH_ENGINES.browser_native.start(lang, {
        interim: t => { this.interim = t; if(t) this.clearStrikes(); renderAmbient(); },
        final: alts => {
          const pick = pickAlternative(alts, roleById(selectedId));
          this.clearStrikes();
          this.onFragment(pick.transcript, pick.confidence);
        },
        error: code => this.onErr(code),
        end: () => this.onEnd()
      });
    }catch(e){
      this.session = null;
      this.noteFailure("the engine refused to start");
      this.scheduleRestart();
    }
  },
  stopListening(){
    const s = this.session;
    this.session = null;
    if(s){ this._expectStop = true; try{ s.stop(); }catch(e){} }
  },
  onEnd(){
    const s = this.session;
    this.session = null;
    const expected = this._expectStop;
    this._expectStop = false;
    if(!this.armed || this.held()) return;
    /* a session that produced audio or lived a while ended naturally; one
       that died right after starting is a strike toward "not hearing" */
    if(!expected){
      if(s && (s.gotResult || Date.now() - s.startedAt > 5000)) this.clearStrikes();
      else this.noteFailure("the engine stopped straight after starting");
    }
    this.scheduleRestart();
  },
  scheduleRestart(){
    clearTimeout(this.restartTimer);
    /* the engine ends itself periodically; back off when it's bouncing, and
       further once it's visibly stalled. Every restart constructs a brand-new
       recogniser instance — a wedged object is never re-started. */
    const delay = this.stalled ? 4000 : (Date.now() - this.lastStart < 1500 ? 2000 : 250);
    this.restartTimer = setTimeout(() => { this.restartTimer = null; this.startListening(); }, delay);
  },
  noteFailure(why){
    this.strikes++;
    if(this.strikes >= 3 && !this.stalled){
      this.stalled = true;
      this.log("fail", "(microphone)", "not hearing anything — " + why + "; still retrying");
      renderAmbient();
    }
  },
  clearStrikes(){
    if(!this.strikes && !this.stalled) return;
    this.strikes = 0;
    if(this.stalled){ this.stalled = false; renderAmbient(); }
  },
  onErr(code){
    if(code === "aborted") return;
    if(code === "not-allowed" || code === "service-not-allowed"){
      this.disarm("Microphone access is off — ambient listening stopped.");
    }
    /* anything transient (no-speech, network): onEnd restarts the session */
  },
  onFragment(t, conf){
    if(!this.armed || !t.trim()) return;
    this.interim = "";
    if(EchoGuard.isEcho(t)) return;              // our own TTS — never re-trigger
    this.buffer = (this.buffer ? this.buffer + " " : "") + t.trim();
    /* length-weighted transcript confidence for the eventual flush */
    if(typeof conf === "number" && conf > 0){
      this.bufWeighted += conf * t.trim().length;
      this.bufChars += t.trim().length;
    }
    if(this.buffer.length >= AMBIENT.BUFFER_CAP){ this.flush(); return; }   // run-on cap
    clearTimeout(this.flushTimer);
    this.flushTimer = setTimeout(() => this.flush(),
      looksLikeQuestion(this.buffer) ? AMBIENT.FLUSH_QUESTION_MS : AMBIENT.FLUSH_MS);
    renderAmbient();
  },
  flush(){
    clearTimeout(this.flushTimer); this.flushTimer = null;
    const raw = this.buffer.trim();
    const tconf = this.bufChars ? Math.round(this.bufWeighted / this.bufChars * 1000) / 1000 : null;
    this.buffer = ""; this.interim = ""; this.bufChars = 0; this.bufWeighted = 0;
    renderAmbient();
    if(!raw) return;
    const text = correctTranscript(raw);
    if(text.length < AMBIENT.MIN_CHARS || text.split(/\s+/).length < AMBIENT.MIN_WORDS) return;
    const norm = EchoGuard.norm(text);
    const now = Date.now();
    this.recent = this.recent.filter(e => now - e.at < AMBIENT.DEDUPE_MS);
    if(this.recent.some(e => EchoGuard.match(norm, e.norm))){
      this.log("dup", text, "near-identical utterance within 8s");
      return;
    }
    this.recent.push({ norm, at: now });
    /* both are captured now: the answer belongs in the conversation that was
       open when the question was overheard, from the persona then answering */
    this.enqueue({ text, roleId: selectedId, conv: convId, at: now, tconf });
  },
  enqueue(item){
    if(this.queue.length >= AMBIENT.QUEUE_CAP){
      const dropped = this.queue.shift();
      this.log("drop", dropped.text, "queue full — oldest dropped");
      micNotice("Ambient queue full — dropped the oldest question.");
    }
    this.queue.push(item);
    renderAmbient();
    this.pump();
  },
  async pump(){
    if(this.busy || !this.armed || !this.queue.length) return;
    this.busy = true;
    const item = this.current = this.queue.shift();
    try{ await this.process(item); }
    catch(e){ this.log("fail", item.text, "pipeline error: " + e.message); }
    finally{
      this.busy = false; this.current = null; this.stageCtl = null; this._wd = false;
      this.setStage("listening");
      if(this.queue.length) this.pump();
    }
  },
  async process(item){
    this.setStage("classifying", item.text);
    const ctl = this.stageCtl = new AbortController();
    let v;
    try{ v = await this.classify(item, ctl.signal); }
    catch(err){
      this.log("fail", item.text, ctl.watchdog
        ? "watchdog reset — the classifier hung past its ceiling"
        : "classifier " + (err.timeout ? "timed out" : "failed: " + err.message));
      return;
    }
    const tnote = typeof item.tconf === "number" ? " · transcript " + Math.round(item.tconf * 100) + "%" : "";
    const conf = " (" + Math.round(v.confidence * 100) + "%" + tnote + ")";
    const need = ambientRequiredConf(item.tconf);
    if(!v.needs_answer || v.confidence < need){
      this.log("no", item.text, (v.reason || "not a question for this role") + conf +
        (v.needs_answer && need > AMBIENT.CONF_MIN ? " — needed " + Math.round(need * 100) + "% for a garbled transcript" : ""));
      return;
    }
    const q = v.normalized_question || item.text;
    this.log("ok", q, (v.topic ? v.topic + " — " : "") + "answering" + conf);
    /* the persona may already be answering a typed message — wait our turn */
    const waitUntil = Date.now() + 60000;
    while(pending.has(item.conv) && this.armed && Date.now() < waitUntil)
      await new Promise(res => setTimeout(res, 500));
    if(!this.armed) return;
    if(pending.has(item.conv)){ this.log("fail", q, "gave up waiting for the busy thread"); return; }
    this.setStage("answering", q);
    /* the message's confidence feeds the Messages tab's TranscriptConfidence
       column — the engine's number when it gave one, else the classifier's */
    const outcome = await sendTo(item.conv, item.roleId, q, {
      vm: { channel:"voice", confidence: typeof item.tconf === "number" ? item.tconf : v.confidence },
      speak: true
    });
    if(outcome !== "answered"){
      this.log("fail", q, this._wd
        ? "watchdog reset — the answer hung past its ceiling"
        : (outcome === "blocked" ? "brief incomplete or thread busy" : "answer " + outcome + " — see the thread"));
    }
  },
  async classify(item, signal){
    const r = roleById(item.roleId);
    const recent = (threads[item.conv] || []).filter(m => !m.error).slice(-4)
      .map(m => ({ role: m.role, content: String(m.content).slice(0, 400) }));
    const data = await sheetCall({
      action:"classify",
      roleId: item.roleId,
      roleTitle: r ? r.title : "",
      company: state.company,
      task: r ? r.task : "",
      context: r ? r.context : "",
      utterance: item.text,
      transcriptConfidence: typeof item.tconf === "number" ? item.tconf : undefined,
      recent,
      instruction: "Decide whether this overheard utterance is a question this role should answer. " +
        "Err toward answering — a missed question is worse than an occasional extra answer. " +
        "Resolve follow-up references against the recent exchange; normalized_question must be a clean, self-contained question."
    }, { timeoutMs: AMBIENT.CLASSIFY_TIMEOUT_MS, signal });
    const v = (data && (data.result || data)) || {};
    return {
      needs_answer: v.needs_answer === true || v.needs_answer === "true",
      normalized_question: String(v.normalized_question || "").trim(),
      confidence: Math.max(0, Math.min(1, Number(v.confidence) || 0)),
      topic: String(v.topic || ""),
      reason: String(v.reason || "")
    };
  },
  /* the backstop, two duties per tick:
     1. engine health — when we should be listening, verify the recogniser
        actually is. A session that never signalled start is aborted and
        DISCARDED (the next start constructs a fresh instance); a missing
        session with no restart pending gets one scheduled.
     2. pipeline — a stage pending far past its own timeout means a hung
        promise; abort it and move on rather than wedging the queue. */
  tick(){
    if(this.armed && !this.held()){
      const s = this.session;
      if(s && !s.gotStart && Date.now() - s.startedAt > this.START_WEDGE_MS){
        this._expectStop = true;      // its onend is ours, not a failure of its own
        this.session = null;
        try{ s.abort(); }catch(e){}
        this.noteFailure("the engine wedged before starting");
        this.scheduleRestart();
      }else if(!s && !this.restartTimer){
        this.scheduleRestart();
      }
    }
    if(!this.busy || !this.stageAt) return;
    const age = Date.now() - this.stageAt;
    if(this.stage === "classifying" && age > this.CLASSIFY_CEILING_MS && this.stageCtl){
      this.stageCtl.watchdog = true;
      try{ this.stageCtl.abort(); }catch(e){}
    }else if(this.stage === "answering" && age > this.ANSWER_CEILING_MS && this.current){
      this._wd = true;
      cancelAnswer(this.current.conv, true);
    }
  },
  setStage(stage, text){
    this.stage = stage;
    this.stageAt = Date.now();
    this.stageText = text || "";
    renderAmbient();
  },
  log(kind, text, why){
    this.decisions.unshift({ kind, text, why, at: Date.now() });
    if(this.decisions.length > AMBIENT.LOG_KEEP) this.decisions.length = AMBIENT.LOG_KEEP;
    renderAmbient();
  }
};
function refreshAmbient(){
  const btn = $("#ambientBtn");
  btn.hidden = !Ambient.supported();
  btn.classList.toggle("on", Ambient.armed);
  btn.classList.toggle("pulse", Ambient.armed);
  btn.setAttribute("aria-pressed", String(Ambient.armed));
  btn.title = Ambient.armed ? "Stop ambient listening" : "Ambient listening — answers questions it overhears";
  btn.setAttribute("aria-label", btn.title);
  $("#ambientBand").hidden = !Ambient.armed;
  if(!Ambient.armed){
    $("#ambLog").hidden = true;
    $("#ambientLogBtn").setAttribute("aria-expanded", "false");
  }
  renderAmbient();
}
function renderAmbient(){
  if(!Ambient.armed) return;
  let label = "Listening", detail = "for questions to answer…", busyDot = false, deadDot = false;
  const heard = (Ambient.buffer + (Ambient.interim ? " " + Ambient.interim : "")).trim();
  if(Ambient.stage === "classifying"){ label = "Analyzing"; detail = "“" + Ambient.stageText + "”"; busyDot = true; }
  else if(Ambient.stage === "answering"){ label = "Answering"; detail = "“" + Ambient.stageText + "”"; busyDot = true; }
  else if(Ambient.paused){ label = "Paused"; detail = "while you dictate"; }
  else if(Ambient.ttsHold){ label = "Paused"; detail = "while the assistant speaks"; }
  else if(Ambient.stalled){ label = "Not hearing"; detail = "the microphone may be off or blocked — still retrying"; deadDot = true; }
  else if(heard){ label = "Heard"; detail = "“" + heard.slice(-90) + "”"; }
  $("#ambientState").textContent = label;
  $("#ambientDetail").textContent = detail;
  $("#ambientBand .ambientDot").classList.toggle("busy", busyDot);
  $("#ambientBand .ambientDot").classList.toggle("dead", deadDot);
  const qEl = $("#ambientQueue");
  qEl.hidden = !Ambient.queue.length;
  qEl.textContent = Ambient.queue.length + " queued";
  renderAmbientLog();
}
function renderAmbientLog(){
  const box = $("#ambLog");
  if(box.hidden) return;
  const ICONS = { ok:"✓", no:"✗", fail:"!", drop:"↓", dup:"≈" };
  box.innerHTML = Ambient.decisions.length
    ? Ambient.decisions.map(d => `<div class="ambRow ${d.kind === "ok" ? "ok" : d.kind === "fail" ? "bad" : "no"}">
        <span class="ico" aria-hidden="true">${ICONS[d.kind] || "·"}</span>
        <span class="t">${esc(clip(d.text, 90))}<small>${esc(d.why)} · ${fmtTime(d.at)}</small></span>
      </div>`).join("")
    : `<div class="ambRow no"><span class="ico">·</span><span class="t">No decisions yet — arm it and ask something out loud.</span></div>`;
}
$("#ambientBtn").addEventListener("click", () => Ambient.armed ? Ambient.disarm() : Ambient.arm());
$("#ambientLogBtn").addEventListener("click", () => {
  const box = $("#ambLog");
  box.hidden = !box.hidden;
  $("#ambientLogBtn").setAttribute("aria-expanded", String(!box.hidden));
  renderAmbientLog();
});

/* =================================================================
   VOICE ACCURACY — none of the voice work above is verifiable
   without a measurement. The Settings › Voice accuracy panel reads
   test phrases aloud one at a time for the user to repeat, records
   what the engine heard, and computes word error rate against the
   expected text — once for the engine's own top guess and once
   after N-best selection and vocabulary fixes, so the delta the
   improvements buy is a number, not a feeling.

   Phrases come from the Sheet's VoiceTests tab (action
   "voiceTests"); without a server the ten built-in phrases — the
   terms this business actually uses — stand in. Each run writes
   LastTranscript / LastAlternativeUsed / LastConfidence /
   LastResult / LastRunAt back to the tab, best-effort. The whole
   panel needs a real microphone on the live page: the stubbed
   engine used elsewhere can't validate any of this.
================================================================= */
const VOICE_TEST_SEED = [
  { id:"vt01", phrase:"Northwind closed the quarter with record ARR." },
  { id:"vt02", phrase:"Schedule the QBR with the Director of Customer Success." },
  { id:"vt03", phrase:"Legal sent back the MSA redline this morning." },
  { id:"vt04", phrase:"The DPA lists every subprocessor we rely on." },
  { id:"vt05", phrase:"Marketing sources over half of our pipeline." },
  { id:"vt06", phrase:"The renewal calendar shows three accounts at risk." },
  { id:"vt07", phrase:"Escalate the SSO ticket to the Escalation Engineer." },
  { id:"vt08", phrase:"Onboarding gets new customers to their first report." },
  { id:"vt09", phrase:"The forecast holds only if pipeline coverage holds." },
  { id:"vt10", phrase:"Compensation bands are owned by the Head of People." }
];
const VoiceTest = {
  paneOpen:false, tests:null, results:{}, running:false, stopFlag:false,
  current:null, phase:"", live:"", session:null, _loaded:false,
  async load(){
    if(!this.tests) this.tests = VOICE_TEST_SEED.map(t => ({ id:t.id, phrase:t.phrase, expected:t.phrase }));
    if(this._loaded || !getToken()) return;
    this._loaded = true;
    try{
      const data = await sheetCall({ action:"voiceTests" }, { timeoutMs:8000 });
      const rows = data && (data.tests || data.rows || data.result);
      if(Array.isArray(rows)){
        const mapped = rows.map(r => ({
          id: String(r.id || r.testId || r.TestId || "").trim(),
          phrase: String(r.phrase || r.Phrase || "").trim(),
          expected: String(r.expected || r.expectedTranscript || r.ExpectedTranscript || r.phrase || r.Phrase || "").trim()
        })).filter(r => r.id && r.phrase);
        if(mapped.length){ this.tests = mapped; renderVoiceTestPane(); }
      }
    }catch(e){}   // the built-in list stands
  },
  open(){
    this.paneOpen = true;
    this.load();
    renderVoiceTestPane();
    goDeep(true);
    $("#sheetTitle").textContent = "Voice accuracy";
  },
  leave(){
    if(!this.paneOpen) return;
    this.paneOpen = false;
    if(this.running) this.stop();
  },
  stop(){
    this.stopFlag = true;
    const s = this.session; this.session = null;
    if(s){ try{ s.abort(); }catch(e){} }
    try{ speechSynthesis.cancel(); }catch(e){}
  },
  async start(){
    if(this.running || !this.tests || !this.tests.length) return;
    if(!SPEECH_ENGINES.browser_native.supported()){ micNotice("This browser has no speech recognition."); return; }
    this.running = true; this.stopFlag = false; this.results = {};
    Speech.stop();
    if(Dictation.active) discardDictation();
    const holdAmbient = Ambient.armed;
    if(holdAmbient) Ambient.pauseForDictation();   // the test owns the microphone slot
    try{
      for(const test of this.tests){
        if(this.stopFlag || !this.paneOpen) break;
        this.current = test.id;
        this.phase = "say"; this.live = "";
        renderVoiceTestPane();
        await this.say(test.phrase);
        if(this.stopFlag || !this.paneOpen) break;
        this.phase = "hear";
        renderVoiceTestPane();
        const heard = await this.capture();
        if(this.stopFlag) break;
        const res = this.score(test, heard);
        this.results[test.id] = res;
        renderVoiceTestPane();
        this.push(test, res);
      }
    }finally{
      this.running = false; this.current = null; this.phase = ""; this.live = "";
      this.session = null;
      if(holdAmbient) Ambient.resumeAfterDictation();
      renderVoiceTestPane();
    }
  },
  /* read the phrase with the persona's voice, off the Speech queue so test
     phrases never enter EchoGuard's buffer — the user is SUPPOSED to repeat
     them, and a buffered copy would make ambient discard that speech later */
  say(text){
    return new Promise(res => {
      if(!Speech.supported()) return res();
      const r = roleById(selectedId);
      const u = new SpeechSynthesisUtterance(text);
      const v = r && Speech.voiceFor(r);
      if(v) u.voice = v;
      u.lang = (v && v.lang) || (r && String(r.language || "").trim()) || "en-US";
      let done = false;
      const fin = () => { if(!done){ done = true; clearTimeout(guard); setTimeout(res, 350); } };
      const guard = setTimeout(fin, 12000);   // a wedged TTS engine can't wedge the test
      u.onend = u.onerror = fin;
      try{ speechSynthesis.speak(u); }catch(e){ fin(); }
    });
  },
  capture(){
    return new Promise(res => {
      const r = roleById(selectedId);
      const finals = [], rawParts = [], confs = [];
      let altIndex = 0, done = false, silence = null, session = null;
      const finish = () => {
        if(done) return;
        done = true;
        clearTimeout(hard); clearTimeout(silence);
        this.session = null; this.live = "";
        if(session){ try{ session.abort(); }catch(e){} }
        res({
          raw: rawParts.join(" ").trim(),
          picked: finals.join(" ").trim(),
          altIndex,
          confidence: confs.length ? Math.round(confs.reduce((a, b) => a + b, 0) / confs.length * 1000) / 1000 : null
        });
      };
      const hard = setTimeout(finish, 9000);
      try{
        session = this.session = SPEECH_ENGINES.browser_native.start((r && String(r.language || "").trim()) || "en-US", {
          interim: t => { this.live = t; renderVoiceTestPane(); },
          final: alts => {
            const pick = pickAlternative(alts, r);
            rawParts.push(alts[0].transcript.trim());
            finals.push(pick.transcript.trim());
            if(pick.index > altIndex) altIndex = pick.index;
            if(typeof pick.confidence === "number" && pick.confidence > 0) confs.push(pick.confidence);
            clearTimeout(silence);
            silence = setTimeout(finish, 1600);
          },
          error: () => finish(),
          end: () => finish()
        });
      }catch(e){ finish(); }
    });
  },
  score(test, heard){
    const corrected = correctTranscript(heard.picked);
    return {
      heardRaw: heard.raw, heard: corrected,
      altIndex: heard.altIndex, confidence: heard.confidence,
      werRaw: heard.raw ? wer(test.expected, heard.raw) : 1,
      werCor: heard.picked ? wer(test.expected, corrected) : 1,
      ok: !!heard.picked, at: Date.now()
    };
  },
  push(test, res){
    if(!getToken()) return;
    sheetCall({ action:"voiceTestResult", result:{
      testId: test.id,
      transcript: res.heard,
      rawTranscript: res.heardRaw,
      alternativeUsed: res.altIndex,
      confidence: res.confidence,
      result: res.ok ? "WER " + Math.round(res.werCor * 100) + "% (raw " + Math.round(res.werRaw * 100) + "%)" : "no speech heard",
      runAt: new Date().toISOString()
    }}, { timeoutMs:10000 }).catch(() => {});
  }
};
function renderVoiceTestPane(){
  if(!VoiceTest.paneOpen) return;
  const t = VoiceTest;
  const done = (t.tests || []).filter(x => t.results[x.id]);
  const oks = done.map(x => t.results[x.id]).filter(r => r.ok);
  const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const werCor = mean(oks.map(r => r.werCor));
  const werRaw = mean(oks.map(r => r.werRaw));
  const pct = v => v === null ? "—" : Math.round(v * 100) + "%";
  const rows = (t.tests || []).map(x => {
    const r = t.results[x.id];
    const running = t.running && t.current === x.id;
    let ico = "·", cls = "", sub = "";
    if(running){
      ico = "●"; cls = "run";
      sub = t.phase === "say" ? "Listen, then repeat it back…" : (t.live ? "Hearing: " + t.live : "Your turn — repeat the phrase…");
    }else if(r && r.ok){
      cls = r.werCor <= 0.15 ? "ok" : "bad";
      ico = r.werCor <= 0.15 ? "✓" : "✗";
      sub = "Heard: “" + r.heard + "” · WER " + Math.round(r.werCor * 100) + "%" +
        (r.werRaw !== r.werCor ? " (raw " + Math.round(r.werRaw * 100) + "%)" : "") +
        (r.altIndex ? " · alternative " + (r.altIndex + 1) : "") +
        (typeof r.confidence === "number" ? " · conf " + Math.round(r.confidence * 100) + "%" : "");
    }else if(r){
      cls = "bad"; ico = "!"; sub = "Nothing heard — check the microphone.";
    }
    return `<div class="vtRow ${cls}"><span class="ico" aria-hidden="true">${ico}</span>
      <span class="tx">${esc(x.phrase)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></div>`;
  }).join("");
  $("#paneRole").innerHTML = `
    <div class="vtWrap">
    <div class="gLabel">Word error rate${done.length ? " · " + done.length + " of " + t.tests.length + " phrases" : ""}</div>
    <div class="group"><div class="vtBig">
      <div class="cell"><div class="num">${pct(werRaw)}</div><div class="lbl">Engine top guess</div></div>
      <div class="cell"><div class="num">${pct(werCor)}</div><div class="lbl">After selection + fixes</div></div>
      <div class="cell"><div class="num">${PickStats.nonTop}/${PickStats.finals || 0}</div><div class="lbl">Alt picks · session</div></div>
    </div></div>
    <div class="group" style="margin-top:14px">
      <button class="row" data-vt-toggle><span class="k" style="color:${t.running ? "var(--danger)" : "var(--accent)"}">${t.running ? "Stop the test" : (done.length ? "Run it again" : "Read phrases and measure")}</span></button>
    </div>
    <div class="gLabel">Phrases</div>
    <div class="group">${rows}</div>
    <p class="footNote">Each phrase is read aloud — repeat it back once it finishes. What was heard, which alternative won, its confidence, and the word error rate are logged to the Sheet's VoiceTests tab when the deployment supports it. Run this on the live page with a real microphone; that measured figure is the acceptance number for the voice work.</p>
    </div>`;
}
$("#paneRole").addEventListener("click", e => {
  if(!VoiceTest.paneOpen) return;
  if(e.target.closest("[data-vt-toggle]")){
    if(VoiceTest.running) VoiceTest.stop();
    else VoiceTest.start();
    renderVoiceTestPane();
  }
});

$("#cog").addEventListener("click", () => openSettings());
$("#done").addEventListener("click", closeSettings);
$("#back").addEventListener("click", () => { renderMain(); goDeep(false); });
$("#scrim").addEventListener("click", () => {
  if($("#sheet").classList.contains("on")) closeSettings();
  else if($("#picker").classList.contains("on")) closePicker();
  else if(chartOpen()) closeChart();
  else if(document.body.classList.contains("menu-open")) closeMenu();
});
addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if($("#sheet").classList.contains("on")){ $("#panes").classList.contains("deep") ? (renderMain(), goDeep(false)) : closeSettings(); }
  else if($("#picker").classList.contains("on")) closePicker();
  else if(chartOpen()) closeChart();
  else if(document.body.classList.contains("menu-open")) closeMenu();
});

/* main pane interactions */
$("#paneMain").addEventListener("click", e => {
  const t = e.target;
  const epr = t.closest("[data-endpoint-reset]");
  if(epr){
    setEndpoint("");
    renderMain();
    if($("#epStatus")) $("#epStatus").textContent = "Back on the built-in endpoint — connecting…";
    scheduleReconnect();
    return;
  }
  const tog = t.closest("[data-toggle]");
  if(tog){ const k = tog.dataset.toggle; state[k] = !state[k]; tog.querySelector(".tog").classList.toggle("on", state[k]); applyChrome(); return; }
  const theme = t.closest("[data-theme]");
  /* the mark's shell colour follows the appearance, so the card header and
     thread (empty-state mark) re-render along with the chart */
  if(theme){ state.appearance = theme.dataset.theme; renderMain(); applyChrome(); renderChart(); renderCard(); renderThread(); return; }
  const acc = t.closest("[data-accent]");
  if(acc){ state.accent = acc.dataset.accent; renderMain(); applyChrome(); return; }
  const ed = t.closest("[data-edit]");
  if(ed){ editingId = ed.dataset.edit; renderRolePane(); goDeep(true); return; }
  const add = t.closest("[data-add]");
  if(add){ addRole(add.dataset.add); return; }
  const act = t.closest("[data-act]");
  if(act) mainAction(act.dataset.act, act);
});
$("#paneMain").addEventListener("input", e => {
  const tok = e.target.closest("[data-token]");
  if(tok){
    const got = applyTokenInput(tok.value);
    const status = $("#epStatus");
    if(got.kind === "badUrl"){
      if(status) status.textContent = "That looks like a link, but not a Web app URL — copy the one ending in /exec from Deploy › Manage deployments.";
      return;   // store nothing; a wrong URL must not clobber a working setup
    }
    if(got.kind === "urlWithToken" || got.kind === "urlOnly"){
      /* the field keeps showing the token; the endpoint lives on its own row */
      tok.value = got.token || "";
      renderMain();
      if($("#epStatus")) $("#epStatus").textContent = got.kind === "urlWithToken"
        ? "Endpoint and token saved from the pasted URL — connecting…"
        : "Endpoint saved — still needs the access token. Connecting…";
    }else if(status){
      status.textContent = getToken() ? "Connecting to the Sheet…" : connStatusText();
    }
    scheduleReconnect();
    return;
  }
  const f = e.target.closest("[data-text]"); if(!f) return;
  state[f.dataset.text] = f.value; applyChrome();
});

/* role pane interactions */
$("#paneRole").addEventListener("click", e => {
  const r = roleById(editingId); if(!r) return;
  const t = e.target;
  const skin = t.closest("[data-look-skin]");
  if(skin){ r.look.skin = skin.dataset.lookSkin; touchRole(r); renderRolePane(); refreshAfterEdit(); return; }
  if(t.closest("[data-look-style]")){ r.look.style = (r.look.style + 1) % 6; touchRole(r); renderRolePane(); refreshAfterEdit(); return; }
  /* --- knowledge sources --- */
  const knRm = t.closest("[data-kn-remove]");
  if(knRm){
    r.knowledge.splice(+knRm.dataset.knRemove, 1);
    knEditor = null; touchRole(r); renderRolePane(); refreshAfterEdit(); return;
  }
  const knUp = t.closest("[data-kn-up]");
  if(knUp){
    const i = +knUp.dataset.knUp;
    if(i > 0){
      const [moved] = r.knowledge.splice(i, 1);
      r.knowledge.splice(i - 1, 0, moved);
      touchRole(r); renderRolePane(); refreshAfterEdit();
    }
    return;
  }
  const knEd = t.closest("[data-kn-edit]");
  if(knEd){
    const i = +knEd.dataset.knEdit, k = knSource(r.knowledge[i]);
    /* a label-only source opens as text, which is the thing it was always
       standing in for — saving it turns it into one, leaving it alone doesn't */
    knEditor = Object.assign(knDraft(k.type === "url" ? "url" : "text", i),
      { label: k.label, url: k.url, text: k.text });
    renderRolePane(); return;
  }
  if(t.closest("[data-kn-new]")){ knEditor = { mode:"pick" }; renderRolePane(); return; }
  const knPick = t.closest("[data-kn-pick]");
  if(knPick){ knEditor = knDraft(knPick.dataset.knPick); renderRolePane(); return; }
  if(t.closest("[data-kn-cancel]")){ knEditor = null; renderRolePane(); return; }
  if(t.closest("[data-kn-save]")){ knSave(); return; }
  if(t.closest("[data-voice-preview]")){ Speech.preview(r); return; }
  if(t.closest('[data-act="delete"]')) deleteRole();
});
$("#paneRole").addEventListener("input", e => {
  const r = roleById(editingId); if(!r) return;
  /* A draft field writes straight into knEditor and deliberately does NOT
     re-render: re-rendering a textarea mid-paragraph moves the caret to the
     end of it. The list catches up when Save commits. */
  const kf = e.target.closest("[data-kn-field]");
  if(kf && knEditor){ knEditor[kf.dataset.knField] = e.target.value; knEditor.err = ""; return; }
  const f = e.target.closest("[data-role-field]");
  if(f){
    r[f.dataset.roleField] = f.value;
    touchRole(r);
    refreshAfterEdit();
    if(f.dataset.roleField === "title") $("#sheetTitle").textContent = r.title;
  }
});
$("#paneRole").addEventListener("change", e => {
  const r = roleById(editingId); if(!r) return;
  const sel = e.target.closest('[data-look="dept"]');
  if(sel){ r.dept = sel.value; touchRole(r); renderRolePane(); refreshAfterEdit(); return; }
  const v = e.target.closest("[data-voice]");
  if(v){ r.voice = v.value; touchRole(r); }
});
$("#paneRole").addEventListener("keydown", e => {
  /* Enter saves a one-line draft; in the text body it is a newline, because
     the whole point of that field is that it holds more than one line. */
  if(e.key === "Enter" && !e.shiftKey && e.target.closest("[data-kn-field]") && e.target.tagName !== "TEXTAREA"){
    e.preventDefault(); knSave();
  }
});
function addRole(dept){
  const lead = state.roles.find(r => r.dept === dept && r.parent && roleById(r.parent)?.dept !== dept)
            || state.roles.find(r => r.dept === dept)
            || state.roles.find(r => r.parent === null);
  const id = "role" + Date.now().toString(36);
  state.roles.push({
    id, parent: lead ? lead.id : null, dept,
    title:"New role",
    look:{ skin:"", style:Math.floor(Math.random()*6) },
    personality:"", context:"", task:"", knowledge:[], outcome:""
  });
  editingId = id; renderRolePane(); goDeep(true); renderChart();
}
let armedDelete = false;
function deleteRole(){
  const r = roleById(editingId);
  const kids = state.roles.filter(x => x.parent === r.id);
  if(r.parent === null || kids.length){
    $("#delNote").textContent = kids.length
      ? "This role has people reporting to it. Move or remove them first."
      : "The top role can't be removed.";
    return;
  }
  if(!armedDelete){
    armedDelete = true;
    $("#delLabel").textContent = "Tap again to remove " + r.title;
    $("#delNote").textContent = "This can't be undone.";
    setTimeout(() => { armedDelete = false; if(editingId === r.id) renderRolePane(); }, 4000);
    return;
  }
  const wasSelected = selectedId === r.id;
  /* A conversation this role started is still readable history, so it is kept —
     it just has nobody left to answer it. Only its place in the cast goes, so
     it stops offering itself in the bar of every conversation it was in. */
  const orphaned = Object.keys(convs).filter(k => convs[k].root === r.id);
  state.roles = state.roles.filter(x => x.id !== r.id);
  orphaned.forEach(k => cancelAnswer(k, true));
  Object.keys(participants).forEach(k => {
    participants[k] = participants[k].filter(id => id !== r.id);
  });
  if(PopOut.roleId === r.id || orphaned.indexOf(PopOut.convId) >= 0) PopOut.close();
  armedDelete = false; renderMain(); goDeep(false); renderChart(); renderSide();
  /* Standing in a conversation whose only voice just left means leaving it. */
  if(wasSelected || !castOf(convId).length) selectRole((rootRole() || {}).id, { conv: undefined });
}
let armedReset = false;
function mainAction(act, el){
  if(act === "voicetest"){ VoiceTest.open(); return; }
  if(act === "export"){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = state.company.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-org-chart.json";
    a.click(); URL.revokeObjectURL(a.href);
    return;
  }
  if(act === "import"){ $("#importFile").click(); return; }
  if(act === "reset"){
    if(!armedReset){
      armedReset = true;
      el.querySelector(".k").textContent = "Tap again to reset everything";
      setTimeout(() => { armedReset = false; renderMain(); }, 4000);
      return;
    }
    state = structuredClone(DEFAULTS); rebuildDepts(state.roles); normalizeRoles(); armedReset = false;
    setConnected(false);
    [...inflight.keys()].forEach(id => cancelAnswer(id, true));
    Object.keys(threads).forEach(k => delete threads[k]);
    Object.keys(convs).forEach(k => delete convs[k]);
    Object.keys(participants).forEach(k => delete participants[k]);
    Object.keys(pinned).forEach(k => delete pinned[k]);
    convId = null;
    renderMain(); applyChrome(); renderChart();
    selectRole(rootRole().id, { conv: undefined });
    renderSide();
    syncPip();
  }
}
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.roles) || !data.roles.length) throw new Error("no roles");
      state = Object.assign(structuredClone(DEFAULTS), data);
      rebuildDepts(state.roles);
      normalizeRoles();
      setConnected(false);
      /* the whole cast changed identity — conversation membership from the old
         chart means nothing against the new one, so an imported chart starts a
         conversation of its own rather than inheriting one */
      Object.keys(participants).forEach(k => delete participants[k]);
      renderMain(); goDeep(false); applyChrome(); renderChart();
      selectRole(rootRole().id, { conv: makeConv(rootRole().id).id });
      renderSide();
      syncPip();
    }catch(err){
      alert("That file isn't a chart this page can read. Export one from Settings to see the expected format.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ========== zoom ========== */
const ZOOMS = [0.55,0.65,0.75,0.85,1,1.15,1.3];
let zoomIdx = 4, userZoomed = false;
function applyZoom(){
  $("#tree").style.setProperty("--zoom", ZOOMS[zoomIdx]);
  document.querySelectorAll("[data-zoom]").forEach(b => {
    b.disabled = Number(b.dataset.zoom) > 0 ? zoomIdx === ZOOMS.length - 1 : zoomIdx === 0;
  });
}
function autoFit(){
  if(userZoomed) return applyZoom();
  const tree = $("#tree"), box = $(".chartScroll");
  tree.style.setProperty("--zoom", 1);
  const need = tree.scrollWidth + 48, have = box.clientWidth;
  if(!need || !have) return applyZoom();
  const ratio = have / need;
  zoomIdx = 4;
  for(let i = 4; i >= 0; i--){ if(ZOOMS[i] <= ratio || i === 0){ zoomIdx = i; break; } }
  applyZoom();
}

/* ========== go ========== */
$("#appBannerClose").addEventListener("click", hideBanner);

async function boot(){
  let banner = "";
  if(getToken()){
    try{
      lastWarm = Date.now();          // the config call itself warms the deployment
      await loadFromSheet();
    }catch(err){
      /* a token IS set, so "add your access token" would misdirect — lead
         with what actually failed, in the server's own words. This is no
         longer the only attempt: the retry chain keeps going underneath,
         so the banner promises a retry instead of demanding a reload, and
         clears itself the moment one succeeds. */
      if(!NEEDS_A_HUMAN.test(err.message)) scheduleRetry();
      banner = "<b>Couldn't load from your Sheet</b> — running on built-in sample data" +
        (retryTimer ? ", retrying in the background" : "") + ". The Sheet said: " +
        esc(String(err.message).replace(/\.\s*$/, "")) + "." +
        (err.code === "TIMEOUT" ? " The deployment was cold or unreachable." :
         /token/i.test(err.message) ? " If it keeps failing, re-paste the access token in Settings › Chat — it must match the one in the Apps Script's Script Properties." : "");
    }
  }else{
    banner = SAMPLE_BANNER;
  }
  if(!sheetConnected) rebuildDepts(state.roles);
  normalizeRoles();
  refreshPipBtn();
  refreshAmbient();
  applyChrome();
  renderChart();
  setSidePane("chats");
  /* Land on a new conversation with the person at the top, not inside the last
     one that happened to be newest — reopening someone else's finished thread
     is not what opening the app means. The history is one click away in the
     menu beside it. */
  selectRole(rootRole().id, { conv: makeConv(rootRole().id).id });
  $("#menuBtn").setAttribute("aria-expanded", String(innerWidth > 900));
  renderSide();
  if(banner) showBanner(banner);
  $("#bootVeil").classList.add("off");
}
boot();
