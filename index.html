<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northwind Cloud — Org Chart</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#EFEFF4; --wash:#F7F7FA; --card:#FFFFFF; --group:#FFFFFF; --field:#F2F2F7;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#8E8E93;
  --sep:rgba(60,60,67,.16); --line:rgba(60,60,67,.24);
  --accent:#0A84FF; --danger:#FF3B30;
  --nav:rgba(247,247,250,.72);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.09);
  --shadow-lift:0 2px 4px rgba(0,0,0,.06), 0 18px 44px rgba(0,0,0,.14);
  --r:22px;
  --railW:clamp(280px,22vw,340px);
  --spring:cubic-bezier(.32,.72,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
body.dark{
  --bg:#000000; --wash:#0A0A0C; --card:#1C1C1E; --group:#1C1C1E; --field:#2C2C2E;
  --label:#F5F5F7; --label2:#A1A1A6; --label3:#8E8E93;
  --sep:rgba(84,84,88,.55); --line:rgba(120,120,128,.45);
  --nav:rgba(12,12,14,.72);
  --shadow:0 1px 2px rgba(0,0,0,.6), 0 12px 34px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.7), 0 20px 50px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--label);
  background:var(--bg); height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* App shell: both columns sit in one centered composition. On an ultrawide
   monitor the shell stops at 1560px with even wash margins on both sides —
   the columns never stretch to fill the screen. */
.stage{
  flex:1;display:flex;min-height:0;
  width:100%;max-width:1560px;margin-inline:auto;
}
@media (min-width:1561px){ .stage{border-inline:.5px solid var(--sep)} }
/* The side menu is the app's spine: every conversation you have ever had is
   in it, and the team you can start a new one with is one tap away. Desktop
   keeps it open as the left column; mobile slides it in over the chat. */
.side{
  flex:none;width:var(--railW);min-width:0;
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:3;
  border-right:.5px solid var(--sep);background:var(--card);
}
body.rail-off .side{display:none}
/* The tree needs width, so on desktop it renders only in the View chart
   overlay; this pane is its mobile home and the node it returns to on close. */
.chartPane{display:none;flex-direction:column;min-height:0}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 15% -5%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
    radial-gradient(50vw 40vh at 95% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 65%),
    var(--wash);
}
button{font-family:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:3px; border-radius:8px}

/* ---------- nav ---------- */
.nav{
  position:relative; z-index:40; flex:none; display:flex; align-items:center; gap:12px;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px) * 0); height:60px;
  background:var(--nav); border-bottom:.5px solid var(--sep);
  -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px);
}
.mark{width:32px;height:32px;flex:none;display:block}
.navTitle{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.navTitle b{font-size:16px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navTitle span{font-size:12px;color:var(--label2)}
.navSpace{flex:1}
.iconBtn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--card); box-shadow:var(--shadow); color:var(--accent);
  transition:transform .35s var(--spring), background .2s;
}
.iconBtn:active{transform:scale(.9)}
.iconBtn svg{width:19px;height:19px}
#cog svg{transition:transform .7s var(--spring)}
#cog:hover svg{transform:rotate(60deg)}
.seg.paneSwitch{display:none;flex:none}
.paneSwitch button{min-width:64px}

/* ---------- rail + chart ---------- */
/* Desktop: the rail is a vertical outline of the org — a horizontal tree can
   never fit a narrow column, so the tree renders only in the "View chart"
   overlay, where it has room. The heading collapses to a small label and the
   intro line hides. Mobile restores the big heading and keeps the tree as its
   Chart pane. */
.head{padding:16px 16px 0;text-align:left;flex:none}
.head h1{margin:0;font-size:11px;line-height:1.3;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--label3)}
.head p{display:none;margin:7px auto 0;max-width:46ch;font-size:14px;color:var(--label2);line-height:1.45}
/* ---------- side menu ---------- */
.sideTop{padding:12px 14px 4px;flex:none}
.newChat{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;letter-spacing:-.01em;
  color:#fff;background:var(--accent);
  transition:transform .3s var(--spring),filter .2s;
}
.newChat svg{width:15px;height:15px}
.newChat:hover{filter:brightness(1.06)}
.newChat:active{transform:scale(.97)}
.sideTabs{padding:10px 14px 2px;flex:none}
.sideTabs .seg{width:100%}
.sideTabs .seg button{flex:1;padding:6px 8px}
.sideSearch{margin:10px 14px 4px}
.sideSearch input{font-size:14px}
.sidePane{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 0 26px;scrollbar-width:thin}
.sidePane[hidden]{display:none}
.cLabel{
  padding:14px 16px 6px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--label3);
}
.cRow{
  position:relative;display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 10px 9px 16px;text-align:left;transition:background .15s;
}
.cRow:hover{background:color-mix(in srgb,var(--label) 5%,transparent)}
.cRow.on{background:color-mix(in srgb,var(--tint) 11%,transparent)}
.cRow.on::before{
  content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;
  border-radius:0 2px 2px 0;background:var(--tint);
}
/* the cast, stacked — a conversation that changed hands says so at a glance */
.cFaces{display:flex;flex:none;align-items:center}
.cFaces .avatar{width:26px;height:26px;display:block;border-radius:50%}
.cFaces .avatar + .avatar{margin-left:-9px;box-shadow:0 0 0 2px var(--card)}
.cRow.on .cFaces .avatar + .avatar{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 11%,var(--card))}
.cMore{
  width:26px;height:26px;margin-left:-9px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--field);color:var(--label2);font-size:9.5px;font-weight:700;
  box-shadow:0 0 0 2px var(--card);
}
.cText{flex:1;min-width:0}
.cTitle{
  display:block;font-size:13.5px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cRow.on .cTitle{font-weight:600}
.cMeta{
  display:block;font-size:11px;color:var(--label3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cMeta mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:3px}
.cSpin{
  width:12px;height:12px;flex:none;border-radius:50%;
  border:2px solid var(--field);border-top-color:var(--accent);animation:spin .8s linear infinite;
}
/* Rename and delete live on the row, revealed on hover or keyboard focus, so
   the list stays quiet until you reach for them. */
.cActs{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .15s}
.cRowWrap{position:relative;display:flex;align-items:center}
.cRowWrap:hover .cActs,.cRowWrap:focus-within .cActs{opacity:1}
.cActs button{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--label2);
}
.cActs button:hover{background:var(--field);color:var(--label)}
.cActs button.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.cActs svg{width:14px;height:14px}
.cConfirm{
  display:flex;align-items:center;gap:8px;padding:8px 14px 8px 16px;
  font-size:12px;color:var(--label2);background:color-mix(in srgb,var(--danger) 8%,transparent);
}
.cConfirm b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cConfirm button{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--field)}
.cConfirm button.danger{background:var(--danger);color:#fff}
.cEdit{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 16px}
.cEdit input{
  flex:1;min-width:0;border:0;background:var(--field);border-radius:9px;padding:7px 10px;
  font:inherit;font-size:13.5px;color:var(--label);
}
.cEdit input:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.sideNote{padding:22px 20px;font-size:12.5px;color:var(--label3);line-height:1.55;text-align:center}
.sideNote b{display:block;color:var(--label2);font-weight:600;margin-bottom:3px}
.sideFoot{padding:14px 20px 4px;font-size:11px;color:var(--label3);line-height:1.5;text-align:center}
.railBar{display:flex;align-items:center;padding:10px 16px 12px;border-bottom:.5px solid var(--sep);flex:none}
.viewChart{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--accent);background:var(--field);padding:6px 12px;border-radius:999px;
  transition:transform .3s var(--spring),filter .2s;
}
.viewChart:hover{filter:brightness(.96)}
.viewChart:active{transform:scale(.95)}
.viewChart svg{width:13px;height:13px}
.outline{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 0 26px;scrollbar-width:thin}
.oLabel{
  padding:18px 16px 7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tint);
}
.oRow{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 14px 8px 16px;text-align:left;transition:background .15s;
}
.oRow:hover{background:color-mix(in srgb,var(--label) 5%,transparent)}
.oRow.sub{padding-left:32px}
.oRow .avatar{width:28px;height:28px;flex:none}
.oTitle{
  flex:1;min-width:0;font-size:13.5px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.oRow.is-selected{background:color-mix(in srgb,var(--tint) 10%,transparent)}
.oRow.is-selected::before{
  content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;
  border-radius:0 2px 2px 0;background:var(--tint);
}
.oRow.is-selected .oTitle{font-weight:600}
.oBadge{
  min-width:19px;height:19px;padding:0 5px;border-radius:10px;flex:none;
  background:var(--tint);color:#fff;font-size:10.5px;font-weight:700;
  display:grid;place-items:center;
}
/* The tree and its zoom control travel together: hidden here on desktop,
   shown in the mobile Chart pane, reparented into the overlay when it opens. */
.chartWrap{display:none;flex-direction:column;flex:1;min-height:0;position:relative}
.chartScroll{
  flex:1; overflow:auto; padding:22px 24px 70px;
  -webkit-overflow-scrolling:touch; scrollbar-width:thin;
}
.tree{width:max-content;margin-inline:auto;zoom:var(--zoom,1)}
.zoomBar{
  position:absolute; right:18px; bottom:18px; display:flex; gap:2px; padding:3px;
  border-radius:999px; background:var(--nav); box-shadow:var(--shadow);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
}
.zoomBar button{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;color:var(--accent);transition:transform .3s var(--spring),opacity .2s;
}
.zoomBar button:active{transform:scale(.86)}
.zoomBar button:disabled{opacity:.3;cursor:default}
.tree ul{display:flex;justify-content:center;padding:22px 0 0;margin:0;list-style:none;position:relative}
.tree>ul{padding-top:0}
.tree li{
  list-style:none;position:relative;display:flex;flex-direction:column;align-items:center;
  padding:22px 7px 0;
}
.tree li::before,.tree li::after{
  content:"";position:absolute;top:0;right:50%;width:50%;height:22px;
  border-top:1.5px solid var(--line);
}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line)}
.tree li:only-child{padding-top:0}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid var(--line);border-radius:0 9px 0 0}
.tree li:first-child::after{border-radius:9px 0 0 0}
.tree ul ul::before{
  content:"";position:absolute;top:0;left:50%;width:0;height:22px;
  border-left:1.5px solid var(--line);
}
body.no-lines .tree li::before,
body.no-lines .tree li::after,
body.no-lines .tree ul ul::before{border-color:transparent}

.node{
  width:138px;padding:14px 10px 13px;border-radius:20px;
  background:var(--card); box-shadow:var(--shadow); text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .45s var(--spring), box-shadow .35s ease;
  position:relative;
}
.node:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.node:active{transform:scale(.96)}
.node.is-selected{box-shadow:var(--shadow-lift), 0 0 0 3px var(--tint)}
.node .eyebrow{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tint);
}
.node .title{font-size:13.5px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.node .avatar{width:62px;height:62px}
.root-node{width:158px}
.root-node .avatar{width:74px;height:74px}

/* ---------- the mark ---------- */
/* Voice states are driven by data-voice / data-voice-role on <body> plus the
   per-persona rules in #voiceCSS — never by classes on the SVG nodes, which
   any render() would destroy. Everything here is the state-independent base.
   Mark rules are scoped under .avatar: the nav logo <img> also carries the
   class "mark", and must not pick up the breathe animation. */
.avatar{display:block;overflow:visible;transition:transform .35s var(--spring)}
.node:hover .avatar,.oRow:hover .avatar{transform:translateY(-2px) scale(1.04)}
.avatar .mark{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 5.2s ease-in-out infinite}
.avatar .wave rect{transform-box:fill-box;transform-origin:50% 50%}
.avatar .ring{opacity:0}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
/* speaking — bars move independently, staggered */
@keyframes talk{from{transform:scaleY(.28)}to{transform:scaleY(1.32)}}
/* listening — collapse to a pulsing centre + expanding ring */
@keyframes listenDot{0%,100%{transform:scaleY(.16)}50%{transform:scaleY(.30)}}
@keyframes ringOut{0%{opacity:.55;transform:scale(.72)}70%{opacity:0;transform:scale(1.15)}100%{opacity:0;transform:scale(1.15)}}
/* thinking — sequential dip, left to right */
@keyframes think{0%,60%,100%{transform:scaleY(1)}30%{transform:scaleY(.42)}}
/* frozen states keep their static shape: bars at the signature, listening as
   the collapsed centre — only the motion goes */
body.no-motion .avatar .mark,body.no-motion .avatar .wave rect,body.no-motion .avatar .ring{animation:none!important}
@media (prefers-reduced-motion:reduce){
  .avatar .mark,.avatar .wave rect,.avatar .ring,.ambientDot{animation:none!important}
  .mic.listening::after,.speak.pulse::after{animation:none!important;opacity:.6;transform:scale(1.1)}
  *{transition-duration:.01ms!important}
}

/* ---------- role card ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
  transition:opacity .4s ease; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.card{
  flex:1 1 auto;min-width:0;position:relative;z-index:2;
  background:var(--card);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
/* The pane fills the window; the conversation sits in a centered column so a
   wide screen doesn't stretch the thread. Uncapped on mobile. */
.paneCol{
  flex:1;min-height:0;display:flex;flex-direction:column;
  width:100%;max-width:720px;margin-inline:auto;
}
/* The header row holds two separate controls — the role switcher is itself a
   button, so the speaker toggle must be a flex sibling, never a child. */
.cardHead{
  display:flex;align-items:center;flex:none;
  border-bottom:.5px solid var(--sep);
  background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 12%, var(--card)), var(--card));
}
.cardTop{
  padding:20px 20px 16px;display:flex;gap:14px;align-items:center;flex:1;min-width:0;
}
.cardTop .avatar{width:44px;height:44px;flex:none}
.cardTop .meta{min-width:0;flex:1}
.cardTop .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tint)}
.cardTop .titleTxt{margin:3px 0 0;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.cardTop{text-align:left;border:0;font:inherit;cursor:pointer;transition:filter .2s}
.cardTop:active{filter:brightness(.96)}
.headBtns{display:flex;align-items:center;gap:8px;flex:none;margin-right:20px}
.speak{
  width:34px;height:34px;border-radius:50%;background:var(--field);color:var(--label2);
  display:grid;place-items:center;flex:none;
  transition:transform .3s var(--spring),background .25s ease,color .25s ease;
}
.speak[hidden]{display:none}
.speak svg{width:18px;height:18px}
.speak:active{transform:scale(.86)}
.speak.on{background:var(--accent);color:#fff}
.pickChev{width:13px;height:8px;flex:none;color:var(--label3);transition:transform .35s var(--spring)}
.cardTop:active .pickChev{transform:translateY(2px)}
.close{
  width:28px;height:28px;border-radius:50%;background:var(--field);color:var(--label2);
  display:grid;place-items:center;flex:none;font-size:15px;line-height:1;transition:transform .3s var(--spring)
}
.close:active{transform:scale(.86)}
.cardBody{padding:4px 20px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.field{padding:16px 0;border-bottom:.5px solid var(--sep)}
.field:last-of-type{border-bottom:0}
.field h3{
  margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--label3);
}
.field p{margin:0;font-size:15px;line-height:1.5;color:var(--label);letter-spacing:-.008em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chip{
  font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;
  background:color-mix(in srgb, var(--tint) 14%, transparent);
  color:color-mix(in srgb, var(--tint) 72%, var(--label));
}
body.dark .chip{color:color-mix(in srgb, var(--tint) 78%, #fff)}
.cardFoot{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep);flex:none}
.wideBtn{
  width:100%;padding:13px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:-.01em;transition:transform .3s var(--spring),filter .2s;
}
.wideBtn:active{transform:scale(.975);filter:brightness(.94)}
.wideBtn.ghost{background:var(--field);color:var(--accent)}
.wideBtn.danger{background:var(--field);color:var(--danger)}

/* ---------- settings sheet ---------- */
.sheet{
  position:fixed;z-index:70;background:var(--bg);box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;overflow:hidden;
  left:50%;top:50%;width:min(560px,calc(100vw - 40px));height:min(760px,calc(100dvh - 80px));
  border-radius:26px;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;
  transition:transform .5s var(--spring),opacity .3s ease;
}
.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sheetNav{
  display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px;
  border-bottom:.5px solid var(--sep);background:var(--nav);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
.sheetNav .t{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.01em}
.navAct{font-size:16px;color:var(--accent);display:flex;align-items:center;gap:3px;min-width:74px}
.navAct.right{justify-content:flex-end;font-weight:600}
.navAct[hidden]{visibility:hidden;display:flex}
.panes{display:flex;width:200%;flex:1;min-height:0;transition:transform .45s var(--spring)}
.panes.deep{transform:translateX(-50%)}
.pane{width:50%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.gLabel{
  font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label3);
  padding:22px 14px 8px;
}
.group{background:var(--group);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:50px;width:100%;text-align:left;
  border-bottom:.5px solid var(--sep);
}
.row:last-child{border-bottom:0}
button.row{transition:background .15s}
button.row:active{background:var(--field)}
.row .k{font-size:16px;letter-spacing:-.01em;flex:1;min-width:0}
.row .k small{display:block;font-size:12.5px;color:var(--label2);margin-top:2px;line-height:1.35}
.row .v{font-size:15px;color:var(--label2);max-width:52%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .avatar{width:34px;height:34px;flex:none}
#pickerList .row .avatar{width:56px;height:56px}
.chev{width:8px;height:14px;flex:none;color:var(--label3)}
.row input.text{
  flex:1;border:0;background:none;font-size:16px;color:var(--label);text-align:right;min-width:0;padding:0;
}
.row input.text:focus{outline:none}
.row.col{display:block;padding:14px}
.row.col .lab{font-size:11px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--label3);margin-bottom:8px}
/* Wrappers the desktop full-screen settings layout lays out against. Below
   901px they are transparent — plain blocks, or absent from the box tree
   entirely — so the phone sheet renders exactly as it always has. */
.sect,.roleGrid,.tile{display:block}
.briefHead{display:contents}
/* display:contents hides the box but not the tree, so :last-child still
   lands inside the wrapper — put the divider back that it takes away */
.briefHead > .row:last-child{border-bottom:.5px solid var(--sep)}
.ta{
  width:100%;border:0;background:var(--field);border-radius:12px;padding:11px 12px;resize:vertical;
  font-size:15px;line-height:1.45;color:var(--label);min-height:78px;
}
.ta:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0}
.oneline{min-height:0;height:44px;resize:none}

/* toggle */
.tog{width:51px;height:31px;border-radius:999px;background:var(--field);position:relative;flex:none;transition:background .3s var(--spring)}
.tog::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .32s var(--spring);
}
.tog.on{background:#34C759}
.tog.on::after{transform:translateX(20px)}
/* segmented */
.seg{display:flex;background:var(--field);border-radius:10px;padding:2px;position:relative;flex:none}
.seg button{
  position:relative;z-index:1;font-size:13.5px;font-weight:500;padding:6px 16px;border-radius:8px;
  color:var(--label);transition:font-weight .2s;
}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{
  position:absolute;top:2px;left:2px;bottom:2px;width:calc(50% - 2px);background:var(--card);
  border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .35s var(--spring);
}
.seg.b .thumb{transform:translateX(100%)}
/* swatches */
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:14px}
.sw{width:30px;height:30px;border-radius:50%;position:relative;transition:transform .3s var(--spring)}
.sw:active{transform:scale(.88)}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--label);opacity:.85}
/* editor chips */
.editChips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.editChip{
  display:flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 8px 6px 12px;border-radius:999px;
  background:var(--field);
}
.editChip button{width:17px;height:17px;border-radius:50%;background:var(--label3);color:var(--card);font-size:11px;line-height:1;display:grid;place-items:center}
.addRow{display:flex;gap:8px}
.addRow input{flex:1;border:0;background:var(--field);border-radius:12px;padding:11px 12px;font-size:15px;color:var(--label)}
.addRow input:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.addRow button{padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
/* knowledge sources: a list of links and pasted text, each editable in place */
.knList{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.knRow{display:flex;align-items:flex-start;gap:10px;background:var(--field);border-radius:12px;padding:10px 11px}
.knRow .knMain{flex:1;min-width:0}
.knRow .knName{font-size:14.5px;font-weight:550;letter-spacing:-.008em;overflow-wrap:anywhere}
.knRow .knSub{
  font-size:12px;color:var(--label3);margin-top:2px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
}
.knRow .knSub a{color:var(--accent);text-decoration:none}
.knTag{
  flex:none;margin-top:1px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--label3) 20%,transparent);color:var(--label2);
}
.knTag.url{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.knTag.text{background:color-mix(in srgb,#34C759 17%,transparent);color:#1E7E34}
body.dark .knTag.text{color:#5FD97C}
.knActs{display:flex;gap:4px;flex:none}
.knActs button{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;color:var(--label2);background:color-mix(in srgb,var(--label3) 16%,transparent);
}
.knActs button:active{transform:scale(.9)}
.knEmpty{font-size:14px;color:var(--label3);padding:2px 2px 4px}
/* the fork every new source starts at: a link, or text you paste */
.knPick{display:flex;gap:8px}
.knPick button{
  flex:1;padding:13px 10px;border-radius:12px;background:var(--field);
  font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.35;
}
.knPick button small{display:block;font-size:11.5px;font-weight:400;color:var(--label3);margin-top:3px}
.knPick button:active{transform:scale(.97)}
.knForm{display:flex;flex-direction:column;gap:8px}
.knForm .lab2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label3)}
.knForm input,.knForm textarea{
  width:100%;border:0;background:var(--field);border-radius:12px;padding:11px 12px;
  font:inherit;font-size:15px;color:var(--label);
}
.knForm textarea{min-height:132px;resize:vertical;line-height:1.5}
.knForm input:focus,.knForm textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.knForm .knBtns{display:flex;gap:8px;justify-content:flex-end}
.knForm .knBtns button{padding:10px 18px;border-radius:12px;font-size:15px;font-weight:600}
.knForm .knBtns .save{background:var(--accent);color:#fff}
.knForm .knBtns .cancel{background:var(--field);color:var(--label2)}
.knForm .knErr{font-size:12.5px;color:var(--danger)}
.knAdd{
  align-self:flex-start;font-size:14.5px;font-weight:600;color:var(--accent);
  padding:8px 2px;letter-spacing:-.01em;
}
/* the card's read-only chips carry the same three kinds */
.chip.url::before,.chip.text::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;
  vertical-align:middle;background:currentColor;opacity:.7;
}
a.chip{text-decoration:none}
a.chip:hover{text-decoration:underline}
.editHero{display:flex;align-items:center;gap:14px;padding:16px 14px}
.editHero .avatar{width:104px;height:104px;flex:none}
.editHero .n{font-size:17px;font-weight:600;letter-spacing:-.015em}
.editHero .d{font-size:12.5px;color:var(--label2);margin-top:2px}
.footNote{font-size:12.5px;color:var(--label3);line-height:1.55;padding:10px 14px 0}
.footNote code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--field);color:var(--label2);padding:1.5px 5px;border-radius:5px}

/* ---------- fidelity ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:999px;letter-spacing:-.005em}
.pill.ok{background:color-mix(in srgb,#34C759 16%,transparent);color:#1E7E34}
.pill.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
body.dark .pill.ok{color:#5FD97C}
.field .hashline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--label3);margin-top:8px}
.linkBtn{font-size:13.5px;color:var(--accent);font-weight:500;margin-top:10px;display:block}
.promptView{margin-top:10px;background:var(--field);border-radius:12px;padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.55;
  color:var(--label2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}
.notice{border-radius:16px;padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:4px}
.notice.warn{background:color-mix(in srgb,var(--danger) 11%,transparent);color:var(--danger)}
.notice.info{background:var(--field);color:var(--label2)}
.notice b{display:block;margin-bottom:3px;color:inherit}
.notice button{color:var(--accent);font-weight:600;font-size:13.5px;margin-top:7px}

/* ---------- connection / boot ---------- */
.connDot{
  width:9px;height:9px;border-radius:50%;background:#8E8E93;flex:none;
  transition:background .3s ease, box-shadow .3s ease;
}
.connDot.on{background:#34C759;box-shadow:0 0 0 3px color-mix(in srgb,#34C759 20%,transparent)}
.appBanner[hidden]{display:none}
/* Desktop: a quiet one-line status note under the nav, left-aligned to the
   messenger's content column — not a full-bleed strip. Mobile restores the
   original strip. */
.appBanner{flex:none;font-size:12.5px;line-height:1.45;color:var(--label2)}
.bannerShell{max-width:1560px;margin-inline:auto}
.bannerRow{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 20px 6px calc(var(--railW) + max(0px,(100% - var(--railW) - 720px)/2) + 16px);
}
.bDot{width:6px;height:6px;border-radius:50%;background:var(--label3);flex:none;margin-top:6px}
.appBanner .txt{min-width:0}
.appBanner .txt b{color:var(--label);font-weight:600}
.appBanner .x{
  width:18px;height:18px;border-radius:50%;background:var(--field);color:var(--label2);
  font-size:10px;line-height:1;display:grid;place-items:center;flex:none;align-self:center;
  transition:transform .3s var(--spring);
}
.appBanner .x:active{transform:scale(.86)}
.bootVeil{
  position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:var(--wash);
  font-size:13.5px;color:var(--label2);transition:opacity .35s ease;
}
.bootVeil.off{opacity:0;pointer-events:none}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:3px solid var(--field);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
body.no-motion .spinner{animation-duration:1.6s}

/* ---------- messenger ---------- */
.tabs{padding:10px 16px;border-bottom:.5px solid var(--sep);background:var(--card);flex:none}
.tabs .seg{width:100%}
.tabs .seg button{flex:1}
.chat{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.card.chatting .cardBody,.card.chatting #footBrief{display:none}
.card.chatting .chat{display:flex}
.thread{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px;
}
.stamp{align-self:center;font-size:11px;color:var(--label3);padding:2px 0 8px}
.clearBar{align-self:center;padding-bottom:4px}
.clearBar button{font-size:12px;color:var(--label3);padding:4px 8px;border-radius:8px}
.clearBar button:active{background:var(--field)}
.msg{display:flex;animation:pop .42s var(--spring) both}
.msg.me{justify-content:flex-end}
.bubble{
  max-width:min(68%,560px);padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.44;
  letter-spacing:-.008em;white-space:pre-wrap;overflow-wrap:anywhere;
}
.msg.from .bubble{background:var(--field);border-bottom-left-radius:7px}
.msg.me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:7px}
.msg.err .bubble{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- answers, as sections ----------
   An answer arrives as markdown and is shown as Question / Answer / Sources
   rather than as one block of asterisks. The bubble stops being pre-wrapped
   the moment it holds real blocks, and anything that cannot wrap — a table, a
   code block — scrolls inside its own box so the thread never does. */
.bubble.rich{white-space:normal}
.bubble.wide{max-width:min(86%,720px)}
/* a tagged reply is boxed by .said, not by the bubble, so the room a sectioned
   answer needs has to be given there. Browsers without :has() keep the
   narrower column — legible, just tighter. */
.msg.tagged:has(.bubble.wide) .said{max-width:min(86%,720px)}
.ans{display:flex;flex-direction:column;gap:11px}
.ans > .sect{display:flex;flex-direction:column;gap:5px}
.ans > .sect + .sect{border-top:.5px solid var(--sep);padding-top:11px}
.ans h4{
  margin:0;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--label3);display:flex;align-items:center;gap:6px;
}
.ans .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ans p{margin:0}
.ans h5{margin:2px 0 0;font-size:14px;font-weight:650;letter-spacing:-.012em;color:var(--label)}
.ans ul,.ans ol{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.ans li{margin:0}
.ans li > ul,.ans li > ol{margin-top:4px}
.ans strong{font-weight:650}
.ans a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.ans a:hover{text-decoration:underline}
.ans code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.87em;
  background:color-mix(in srgb,var(--label3) 18%,transparent);padding:1.5px 5px;border-radius:5px;
}
.ans pre{
  margin:0;background:color-mix(in srgb,var(--label3) 14%,transparent);border-radius:11px;padding:11px 13px;
  max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch;
}
.ans pre code{background:none;padding:0;font-size:12.5px;line-height:1.55;white-space:pre}
.ans blockquote{
  margin:0;padding:2px 0 2px 12px;border-left:2.5px solid color-mix(in srgb,var(--label3) 45%,transparent);
  color:var(--label2);
}
.ans hr{border:0;border-top:.5px solid var(--sep);margin:2px 0}
.ans .tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ans table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.ans th,.ans td{padding:6px 11px;text-align:left;border-bottom:.5px solid var(--sep);white-space:nowrap}
.ans th{font-weight:650;color:var(--label2);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase}
.ans tr:last-child td{border-bottom:0}
/* the restatement reads as a quiet header, not as part of the answer */
.ans .sect[data-kind="question"] .body{color:var(--label2);font-size:14px;line-height:1.45}
/* what the answer rests on, listed so it can be checked */
.ans .sect[data-kind="sources"] .body{font-size:13.5px;line-height:1.5;color:var(--label2)}
.ans .sect[data-kind="sources"] ul{list-style:none;padding-left:0;gap:5px}
.ans .sect[data-kind="sources"] li{
  padding:5px 11px;border-radius:9px;background:color-mix(in srgb,var(--tint,#8E8E93) 12%,transparent);
}
.msg.err .bubble a,.msg.me .bubble a{color:inherit;text-decoration:underline}
.dots{display:flex;gap:5px;padding:14px 16px;background:var(--field);border-radius:20px;border-bottom-left-radius:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--label3);animation:dot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,60%,100%{opacity:.32;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
/* Desktop: the empty state doesn't float in the vertical center of a tall
   pane — it anchors above the composer, in the lower reach of the thread.
   Mobile restores the centered version. */
.empty{margin:auto auto clamp(20px,6vh,56px);width:100%;max-width:440px;text-align:center;padding:10px 4px}
.empty .avatar{width:78px;height:78px;margin:0 auto 10px}
.empty h4{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.015em}
.empty p{margin:0 auto 16px;font-size:13.5px;color:var(--label2);line-height:1.45;max-width:30ch}
.starters{display:flex;flex-direction:column;gap:8px;text-align:left}
.starter{
  padding:11px 14px;border-radius:15px;background:var(--field);font-size:14px;
  color:var(--label);transition:transform .3s var(--spring);
}
.starter:active{transform:scale(.97)}
.composer{
  display:none;gap:10px;align-items:flex-end;flex:none;position:relative;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep);
}
.card.chatting .composer{display:flex}
.composerBox{flex:1;min-width:0;position:relative}
.composer textarea{
  width:100%;display:block;border:0;background:var(--field);border-radius:20px;padding:10px 14px;
  font-size:15px;line-height:1.4;color:var(--label);resize:none;height:41px;max-height:124px;
}
.composer textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
/* mirror of the textarea: committed text transparent, interim words lighter.
   Named dictGhost — a plain .ghost class collides with the .wideBtn.ghost
   button variant and stretches that button over the whole card. */
.dictGhost{
  position:absolute;inset:0;border-radius:20px;padding:10px 14px;
  font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:break-word;
  overflow:hidden;pointer-events:none;color:transparent;
}
.dictGhost[hidden]{display:none}
.dictGhost .int{color:var(--label3);background:var(--field);border-radius:3px}
/* low-confidence commits: glyphs stay transparent (the textarea shows them) —
   only the dotted underline paints, so the flag never doubles the text */
.dictGhost .lowc{
  text-decoration:underline dotted color-mix(in srgb,var(--danger) 55%,var(--label3));
  text-decoration-thickness:1.5px;text-underline-offset:3px;
}
.mic{
  width:34px;height:34px;border-radius:50%;background:var(--field);color:var(--label2);
  display:grid;place-items:center;flex:none;margin-bottom:4px;position:relative;
  transition:transform .3s var(--spring),background .25s ease,color .25s ease;
}
.mic[hidden]{display:none}
.mic svg{width:17px;height:17px}
.mic:disabled{opacity:.32;cursor:default}
.mic:not(:disabled):active{transform:scale(.86)}
.mic.listening{background:var(--accent);color:#fff}
.mic.listening::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;
  animation:micPulse 1.6s ease-out infinite;
}
@keyframes micPulse{0%{transform:scale(.85);opacity:.7}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
.mic.flash{background:var(--danger);color:#fff}
.micNotice{
  position:absolute;left:14px;right:14px;bottom:calc(100% + 4px);z-index:5;
  margin-inline:auto;width:max-content;max-width:calc(100% - 28px);
  padding:7px 13px;border-radius:12px;background:var(--card);box-shadow:var(--shadow-lift);
  font-size:12.5px;line-height:1.4;color:var(--danger);text-align:center;
}
.micNotice[hidden]{display:none}
.micNotice.info{color:var(--label2)}
.micNotice button{color:var(--accent);font-weight:600;font-size:12.5px;margin-left:6px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.send{
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:none;margin-bottom:4px;
  transition:transform .3s var(--spring),opacity .2s;
}
.send:disabled{opacity:.32;cursor:default}
.send:not(:disabled):active{transform:scale(.86)}
.send svg{width:17px;height:17px}
.badge{
  position:absolute;top:9px;right:9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--tint);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px var(--card);
}
/* While an answer is in flight the send button becomes a stop button, so the
   thread is never in a loading state the user can't get out of. */
.send.stop{background:var(--danger)}
.send svg[hidden]{display:none}
/* Quiet system notes in the thread (a stopped answer) — visibly not a reply
   and not an alarming error either. */
.msg.note{justify-content:center}
.msg.note .bubble{background:none;color:var(--label3);font-size:12.5px;padding:2px 8px}
/* jump-to-message highlight from history search */
.msg.hl .bubble{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}

/* ---------- who is answering ----------
   A conversation can be handed to another persona without losing the thread.
   The moment more than one has taken part, every reply wears its author's mark
   and name, so the transcript reads unambiguously. Single-persona chats — the
   common case — render exactly as they always have: no mark, no label. Each
   tagged row carries its own --tint inline, so the colour is the speaker's
   department, not the selected persona's. */
.msg.tagged{align-items:flex-start;gap:9px}
.msg.tagged .who{flex:none;margin-top:-1px}
.msg.tagged .who .avatar{width:26px;height:26px;display:block}
.msg.tagged .said{min-width:0;max-width:min(68%,560px);display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.msg.tagged .whoName{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:color-mix(in srgb,var(--tint) 78%,var(--label2));padding-left:4px;
}
body.dark .msg.tagged .whoName{color:color-mix(in srgb,var(--tint) 80%,#fff)}
.msg.tagged .bubble{max-width:100%}
/* the hand-off marker left in the thread when the assistant changes */
.msg.handoff{justify-content:center}
.handoffPill{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:5px 13px 5px 5px;border-radius:999px;font-size:12.5px;color:var(--label2);
  background:color-mix(in srgb,var(--tint) 13%,var(--field));
}
.handoffPill .avatar{width:22px;height:22px;flex:none;display:block}
.handoffPill b{color:var(--label);font-weight:600}
.handoffPill button{color:var(--accent);font-weight:600;font-size:12.5px}
/* the cast: everyone in this conversation, one tap to hand it to any of them */
.castBar{display:none;align-items:center;gap:8px;flex:none;padding:9px 14px 0}
.card.chatting .castBar{display:flex}
.castRow{
  display:flex;align-items:center;gap:6px;flex:1;min-width:0;
  overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
}
.castRow::-webkit-scrollbar{display:none}
.castChip{
  display:flex;align-items:center;gap:7px;flex:none;max-width:210px;
  padding:4px 12px 4px 4px;border-radius:999px;background:var(--field);
  font-size:13px;color:var(--label2);transition:transform .3s var(--spring);
}
.castChip:active{transform:scale(.96)}
.castChip .avatar{width:22px;height:22px;flex:none;display:block}
.castChip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.castChip.on{
  color:var(--label);font-weight:600;
  background:color-mix(in srgb,var(--tint) 15%,transparent);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 45%,transparent);
}
.castAdd{
  flex:none;padding:6px 12px;border-radius:999px;background:var(--field);
  color:var(--accent);font-size:13px;font-weight:600;transition:transform .3s var(--spring);
}

/* ---------- ambient listening ---------- */
.speak.pulse{position:relative}
.speak.pulse::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;
  animation:micPulse 1.6s ease-out infinite;
}
.ambientBand{
  display:flex;align-items:center;gap:9px;padding:7px 16px;flex:none;
  border-top:.5px solid var(--sep);
  background:color-mix(in srgb,var(--accent) 7%,var(--card));

.ambientDot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:ambPulse 1.6s ease-in-out infinite}

.ambientTxt{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline}
.ambientTxt b{font-size:12px;flex:none}

.ambLog{max-height:180px;overflow-y:auto;border-top:.5px solid var(--sep);background:var(--card);flex:none;padding:4px 0}
.ambLog[hidden]{display:none}
.ambRow{display:flex;gap:8px;padding:5px 16px;font-size:12px;line-height:1.35;align-items:flex-start}
.ambRow .ico{flex:none;width:15px;text-align:center;font-weight:700}
.ambRow.ok .ico{color:#28A745}

.ambRow .t{flex:1;min-width:0;color:var(--label)}

/* ---------- role picker ---------- */
.sheet.picker{height:min(640px,calc(100dvh - 120px))}
.picker .pane{width:100%;flex:1;min-height:0}
.search{display:flex;align-items:center;gap:8px;margin:12px 16px 2px;padding:9px 12px;border-radius:12px;background:var(--field);flex:none}
.search svg{width:16px;height:16px;color:var(--label3);flex:none}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- chart overlay ---------- */
.sheet.chartSheet{
  width:min(1560px,calc(100vw - 48px));height:min(880px,calc(100dvh - 64px));
  background:var(--wash);
}
.chartHost{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.chartHost .chartWrap{display:flex}
/* Center the tree in the roomy overlay; auto margins collapse to 0 when the
   tree overflows, so scrolling still starts at the true edge. */
.chartHost .chartScroll{display:flex}
.chartHost .tree{margin:auto}

/* =================================================================
   SETTINGS, FULL SCREEN ON DESKTOP

   Settings was a 560×760 card with a single column running down it.
   That is the right shape for flipping a toggle on a phone and the
   wrong shape for writing a persona: a brief is two identity fields,
   six long ones and a knowledge list, and in a window that size you
   can hold about one and a half of them on screen at once. Adding a
   role meant scrolling a slot and remembering what was above it.

   On a desktop viewport the sheet now takes the whole screen and
   spends the width on making sections visible rather than wide. The
   main pane tiles its sections into columns, so every team, the
   company fields, the connection and the configuration actions are
   all on screen together. The role editor puts identity and the
   destructive action down a narrow left column and opens the brief
   across the rest as a board of cards — each field its own card, the
   knowledge list full width beneath them.

   Nothing here reaches below 901px: the wrappers this leans on are
   transparent at phone widths, and the sheet still rises from the
   bottom as a 94dvh drawer.
================================================================= */
@media (min-width:901px){
  #sheet{
    inset:0;width:auto;height:auto;max-width:none;border-radius:0;
    transform:scale(1.02);
  }
  #sheet.on{transform:none}
  /* at this size the bar reads as a page header, not a card's title strip */
  #sheet .sheetNav{min-height:64px;padding:12px 26px}
  #sheet .sheetNav .t{font-size:19px}
  #sheet .navAct{font-size:15.5px;min-width:96px}
  /* Wide, but not edge-to-edge on a 27-inch display: the content column caps
     out and centres, and the gutter never falls below 30px. The measure is
     the viewport, not a percentage — .panes is 200% wide to carry the two
     panes side by side, so a percentage here resolves against double the
     screen and eats the whole pane. */
  #sheet .pane{padding:0 max(30px,calc((100vw - 1520px)/2)) 64px}

  /* ---- main pane: the sections tile instead of stacking ----
     The columns go on an inner block, not on the scrolling pane itself. A
     multicol box with a definite height fragments sideways — it would put
     the overflow in a fourth and fifth column and scroll horizontally.
     Given an auto height it balances into three and grows downward, which
     is the scroll direction a settings pane is supposed to have. */
  #paneMain .tile{columns:370px 3;column-gap:32px}
  #paneMain .sect{break-inside:avoid-column}
  #paneMain .footNote{padding-bottom:2px}

  /* ---- role editor: identity down the left, the brief across the rest ----
     Row 4 is the 1fr that absorbs whatever the brief is taller by, so the
     left column stays packed at the top however long the brief runs. */
  #paneRole .roleGrid{
    display:grid;
    grid-template-columns:minmax(280px,340px) minmax(0,1fr);
    grid-template-rows:auto auto auto 1fr;
    column-gap:32px;align-items:start;
  }
  #paneRole .sMark {grid-column:1;grid-row:1}
  #paneRole .sVoice{grid-column:1;grid-row:2}
  #paneRole .sRole {grid-column:1;grid-row:3}
  #paneRole .sBrief{grid-column:2;grid-row:1/5}
  /* the brief stops being one long card of hairline-separated rows and
     becomes a board of them, so a field is something you look at rather
     than something you scroll to */
  #paneRole .briefGroup{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:16px;background:none;box-shadow:none;border-radius:0;overflow:visible;
  }
  #paneRole .briefGroup > *{
    background:var(--group);border-radius:16px;box-shadow:var(--shadow);
    border-bottom:0;overflow:hidden;
  }
  #paneRole .briefGroup > .briefWide{grid-column:1/-1}
  #paneRole .briefHead{display:grid;grid-template-columns:1fr 1fr}
  #paneRole .briefHead > .row{border-bottom:0}
  #paneRole .briefHead > .row + .row{border-left:.5px solid var(--sep)}
  #paneRole .briefGroup .ta{min-height:184px}
  #paneRole .knForm textarea{min-height:210px}
  #paneRole .knPick button{max-width:340px}

  /* the voice-accuracy pane is a report, not a form — width would only
     stretch its rows, so it keeps a reading column and centres */
  .vtWrap{max-width:760px;margin-inline:auto}
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .seg.paneSwitch{display:flex}
  .card{width:100%;border-right:0;box-shadow:none}
  body.showing-chart .card{display:none}
  body:not(.showing-chart) .chartPane{display:none}
  .navTitle{display:none}
  /* The side menu slides in over the conversation rather than displacing it,
     so opening it never costs you your place in the thread. */
  .side{
    position:fixed;top:60px;bottom:0;left:0;z-index:60;
    width:min(86vw,340px);border-right:.5px solid var(--sep);
    transform:translateX(-101%);transition:transform .34s var(--spring);
    box-shadow:0 0 40px rgba(0,0,0,.18);
  }
  body.menu-open .side{transform:none}
  body.rail-off .side{display:flex}
  .sheet.picker{height:82dvh}
  .sheet{
    left:0;right:0;top:auto;bottom:0;width:auto;height:94dvh;border-radius:22px 22px 0 0;
    transform:translateY(102%) scale(1);
  }
  .sheet.on{transform:translateY(0)}
  /* Mobile keeps the pre-rail layout: full-width panes, big heading, the tree
     as the Chart pane, centered empty state, and the full-width banner strip. */
  .chartPane{flex:1;width:auto;border-right:0}
  /* View chart is desktop-only — mobile has the Chart pane in the switch above
     — but the outline is how you pick someone inside the drawer, so it stays. */
  .railBar{display:none}
  .chartWrap{display:flex}
  .paneCol{max-width:none}
  .bubble{max-width:82%}
  .thread{padding-top:14px}
  .empty{margin:auto 0;max-width:none}
  .head{text-align:center;padding:26px 20px 2px}
  .head h1{font-size:27px;font-weight:700;letter-spacing:-.026em;text-transform:none;color:var(--label);line-height:1.12}
  .head p{display:block;font-size:13px}
  .appBanner{
    display:block;padding:9px 20px;font-size:13px;
    background:color-mix(in srgb,var(--accent) 8%,var(--card));
    border-bottom:.5px solid var(--sep);
  }
  .bannerShell{max-width:none}
  .bannerRow{display:flex;align-items:center;gap:10px;padding:0}
  .bDot{display:none}
  .appBanner .txt{flex:1}
  .appBanner .x{width:22px;height:22px;font-size:11px}
}

/* Base URL of the Apps Script web app. Safe to commit: it answers nothing
   without the access token, which lives only in this browser (localStorage,
   key "pa_token") and is appended to the URL at runtime.

   Every Apps Script re-deploy that creates a NEW deployment mints a new /exec
   URL, so the constant below is only the default. Settings › Chat accepts the
   full Web app URL (with or without ?token=...) pasted straight from the
   deploy dialog: the app splits it into an endpoint override (localStorage,
   key "pa_endpoint") and the token, and targets that deployment from then on.
   Paste once per browser — nothing needs re-entering after that. */
const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbzowjBwMMSEWcDHW7Z94Ga-57iacv8tOoirSQp4hGJBshvUnWrnn7thKwvzCvmk9_mM/exec";
const TOKEN_KEY = "pa_token";
const ENDPOINT_KEY = "pa_endpoint";

/* Correction pass for dictated text, applied to every final transcript before
   it reaches the composer. Speech-to-text errors are rarely literal, so
   matching is fuzzy: whitespace- and hyphen-tolerant, case-insensitive, and
   (for keys long enough to be unambiguous) within a small edit distance —
   "config manager", "configmanager" and "config-manager" all correct. Matches
   only ever cover whole words and never reach across a sentence boundary, so
   a correction can't change the meaning of surrounding text. Short keys stay
   exact-only: one edit on a three-letter key would swallow real words.

   VOICE_CORRECTIONS seeds the map; when the Sheet's config carries a
   VocabularyFixes table it is merged on top in applyConfig(), so the Sheet
   owns the vocabulary once connected. */
const VOICE_CORRECTIONS = {
  "north wind": "Northwind",
  "arr": "ARR",
  "q b r": "QBR",
  "m s a": "MSA",
  "d p a": "DPA"
};
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const normWords = s => String(s).toLowerCase().replace(/[\s-]+/g, " ").trim();
let VOCAB_RULES = [];
let vocabGen = 0;
const lexCache = new Map();
function compileVocab(map){
  vocabGen++;
  lexCache.clear();
  VOCAB_RULES = Object.keys(map || {}).filter(k => k && map[k]).map(k => {
    const key = String(k), value = String(map[k]);
    const tokens = normWords(key).split(" ");
    const joined = tokens.join("");
    return {
      key, value, tokens, joined,
      /* how many edits a fuzzy match may spend; 0 = exact forms only */
      allow: joined.length >= 10 ? 2 : joined.length >= 5 ? 1 : 0,
      re: new RegExp("\\b" + escRe(key).replace(/\s+/g, "[\\s-]+") + "\\b", "gi")
    };
  }).sort((a, b) => b.joined.length - a.joined.length);
}
compileVocab(VOICE_CORRECTIONS);
/* rows from the Sheet arrive in whatever shape the tab grew into — accept a
   plain object, [wrong, right] pairs, or {wrong, right}-ish records */
function parseVocabConfig(cfg){
  const src = cfg.vocabularyFixes || cfg.vocabulary_fixes || cfg.vocabulary ||
    (cfg.settings && (cfg.settings.vocabularyFixes || cfg.settings.vocabulary_fixes));
  const out = {};
  const put = (k, v) => { k = String(k || "").trim(); v = String(v || "").trim(); if(k && v) out[k] = v; };
  if(Array.isArray(src)) src.forEach(row => {
    if(Array.isArray(row)) put(row[0], row[1]);
    else if(row && typeof row === "object")
      put(row.wrong || row.from || row.heard || row.key, row.right || row.to || row.correct || row.value);
  });
  else if(src && typeof src === "object") Object.keys(src).forEach(k => put(k, src[k]));
  return out;
}
function editDistance(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }

/* words with their offsets in the original string; `core` is the comparable
   form (surrounding punctuation stripped, lowercased, hyphens/apostrophes
   removed) and coreStart/coreEnd bound exactly the replaceable span */
function tokenizeWithOffsets(t){
  const out = [], re = /\S+/g;
  let m;
  while((m = re.exec(t))){
    const raw = m[0];
    const lead = (raw.match(/^[^\p{L}\p{N}]+/u) || [""])[0].length;
    const trail = (raw.match(/[^\p{L}\p{N}]+$/u) || [""])[0].length;
    const core = raw.slice(lead, raw.length - trail);
    if(!core) continue;
    out.push({
      raw,
      core: core.toLowerCase().replace(/[-'’]/g, ""),
      coreStart: m.index + lead,
      coreEnd: m.index + raw.length - trail

  let t = String(text);
  /* pass 1: exact forms, tolerant of spaces vs hyphens */
  VOCAB_RULES.forEach(r => { t = t.replace(r.re, r.value); });
  /* pass 2: fuzzy — slide whole-word windows near the key's word count and
     accept small edit distance on the joined form */
  const toks = tokenizeWithOffsets(t);
  const used = new Array(toks.length).fill(false);
  const repl = [];
  VOCAB_RULES.forEach(r => {
    if(!r.allow) return;
    for(let w = Math.max(1, r.tokens.length - 1); w <= r.tokens.length + 1; w++){
      for(let i = 0; i + w <= toks.length; i++){
        let busy = false;
        for(let k = i; k < i + w; k++) if(used[k]){ busy = true; break; }
        if(busy) continue;
        /* a window may not straddle a sentence boundary */
        if(w > 1){
          let cut = false;
          for(let k = i; k < i + w - 1; k++) if(/[.!?]$/.test(toks[k].raw)){ cut = true; break; }
          if(cut) continue;
        }
        const cand = toks.slice(i, i + w).map(x => x.core).join("");
        if(!cand || Math.abs(cand.length - r.joined.length) > r.allow) continue;
        if(cand[0] !== r.joined[0]) continue;   // first letter must agree — cheap false-positive guard
        if(editDistance(cand, r.joined) > r.allow) continue;
        const s = toks[i].coreStart, e = toks[i + w - 1].coreEnd;
        if(t.slice(s, e) === r.value) continue;  // already the corrected form
        repl.push({ s, e, v: r.value });
        for(let k = i; k < i + w; k++) used[k] = true;
      }
    }

  repl.sort((a, b) => b.s - a.s).forEach(x => { t = t.slice(0, x.s) + x.v + t.slice(x.e); });

}

/* =================================================================

   transcripts per final result; reading only the first discards the
   rest. Every candidate is scored against the persona's vocabulary:
     +3 for each vocabulary term it contains (corrected forms from
        the fixes map, the persona's Title, its department name, and
        capitalised multi-word terms from its Context and Task)
     +1 × the engine's own confidence
     −2 for each term the vocabulary maps AWAY from (a known
        mis-hearing like "north wind")

   than 0 are counted and logged so the benefit stays measurable —
   the Voice accuracy panel in Settings shows the tally.

const PickStats = { finals: 0, nonTop: 0 };

function roleLexicon(role){
  const key = role.id + "|" + (role.version || 1) + "|" + role.dept + "|" + vocabGen;
  const hit = lexCache.get(key);
  if(hit) return hit;
  const terms = new Set();
  VOCAB_RULES.forEach(r => terms.add(r.value));
  if(role.title) terms.add(String(role.title).trim());
  const d = deptOf(role);
  if(d.name) terms.add(d.name);
  (String(role.context || "") + "\n" + String(role.task || "")).replace(CAPS_TERM, t => { terms.add(t.trim()); return t; });
  const away = VOCAB_RULES.filter(r => normWords(r.key) !== normWords(r.value)).map(r => r.key);
  const lex = {
    terms: [...terms].filter(Boolean).map(t => ({ t, re: wordRe(t) })),
    away: away.map(t => ({ t, re: wordRe(t) }))

}

  if(!alts || !alts.length) return { transcript: "", confidence: null, index: 0 };
  const lex = role ? roleLexicon(role) : { terms: [], away: [] };
  let best = null;
  alts.forEach((a, i) => {
    let s = typeof a.confidence === "number" ? a.confidence : 0;
    lex.terms.forEach(term => { if(term.re.test(a.transcript)) s += 3; });
    lex.away.forEach(term => { if(term.re.test(a.transcript)) s -= 2; });
    if(!best || s > best.score) best = { score: s, index: i, transcript: a.transcript, confidence: a.confidence };
  });
  PickStats.finals++;
  if(best.index > 0){
    PickStats.nonTop++;
    console.info("[voice] alternative " + (best.index + 1) + " of " + alts.length + " won: \"" + best.transcript.trim() + "\"");
  }
  return best;
}

/* word error rate, for the Voice accuracy panel: word-level edit distance
   over the reference length, both sides normalised (lowercase, punctuation
   stripped) so capitalisation never counts as an error */
const werTokens = s => String(s).toLowerCase().replace(/[^\p{L}\p{N}'’ ]+/gu, " ")
  .replace(/['’]/g, "").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
function wordEditDistance(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function wer(expected, heard){
  const e = werTokens(expected), h = werTokens(heard);
  if(!e.length) return h.length ? 1 : 0;
  return Math.min(1, wordEditDistance(e, h) / e.length);
}

   "mark color override", so these values in saved charts must read as "no
   override" or every old persona would render a flesh-colored mark. */
const LEGACY_SKIN_TONES = new Set(["#F7DCC4","#F2D3B8","#E6B894","#C98D63","#A9704A","#8D5A3B"]);

/* =================================================================
   A KNOWLEDGE SOURCE IS ONE OF THREE THINGS

   reference — a label and nothing else ("CRM opportunity records").
               What every source was before this, and what a Sheet
               row with no URL and no body still reads as.
   url       — a label and a link the persona may read.
   text      — a label and a body pasted in the admin, which goes
               into the brief verbatim.

   All three share one shape, so nothing downstream branches on kind
   except the two places that should: what the prompt prints, and
   what the editor shows. A bare string coming from an older Sheet,
   an exported file, or the built-in samples normalises to a
   reference, which is why nothing had to be migrated.
