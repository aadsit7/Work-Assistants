function friendlyError(err){
  const tail = err.retried ? " I retried without search before giving up." : "";
  if(err.timeout) return "This answer timed out (" + err.message + ")." + tail +
    " Your message is still above — send it again, or check that the Apps Script deployment is reachable.";
  return "Couldn't get a reply (" + (err.code ? err.code + ": " : "") + err.message + ")." + tail +
    " Check your access token in Settings › Chat, and that the Apps Script deployment allows access to anyone.";
}
function cancelAnswer(key, silent){
  const ctl = inflight.get(key);
  if(!ctl) return;
  if(silent) ctl.silent = true;   // abort without leaving a "stopped" note (used by Clear)
  ctl.abort();
}
/* One send pipeline for every asker. `key` is the conversation the message
   belongs to and `roleId` the persona answering it — the same id in an
   ordinary chat, two different ones once a conversation has been handed on.
   `src.input` is the composer the text came from (undefined for starters and
   ambient asks); answers land in the conversation no matter which window
   asked. Answers to different conversations can be in flight at once —
   pending/inflight are per conversation, so the pop-out and the main composer
   never trip over each other, and two personas can never write into one
   transcript at the same time.
   src.vm overrides the channel metadata (ambient asks log channel "voice"
   with the classifier confidence); src.speak forces the reply through TTS
   regardless of the per-persona speaker toggle. Returns the outcome:
   "answered" | "failed" | "canceled" | "blocked". */
async function sendTo(key, roleId, text, src){
  const r = roleById(roleId);
  if(!r || !key || !text.trim() || pending.has(key)) return "blocked";
  const built = buildPrompt(r);
  if(built.missing.length){ if(convId === key) renderThread(); return "blocked"; }
  joinConv(key, roleId);
  if(!pinned[pinKey(key, r.id)]) pinned[pinKey(key, r.id)] = built.hash;
  const input = src && src.input;
  /* per-message channel flag: "voice" only when this composer draft was
     dictated; starters and typed messages stay "chat". Dictation always
     stops on send, and never auto-sends. */
  if(Dictation.active && dictInterimLen && dictTarget.input === input){
    voiceMeta.dictated = true; voiceMeta.target = input;
  }
  const vm = (src && src.vm) ? src.vm
    : (input && text === input.value && voiceMeta.target === input
      ? consumeVoiceMeta() : { channel:"chat" });
  if(input && dictTarget.input === input) discardDictation();
  Speech.stop();
  /* A conversation reached through the pop-out or an ambient ask may never have
     been opened here, so make sure it has a record before it gets a message. */
  if(!convs[key]) makeConv(roleId, { id: key });
  threads[key] = threads[key] || [];
  threads[key].push({ role:"user", content:text.trim(), at:Date.now(), to:roleId, channel:vm.channel, confidence:vm.confidence });
  touchConv(key);
  dropEmptyConvs(key);
  renderSide();
  if(input){ input.value = ""; if(src.reset) src.reset(); }
  const ctl = new AbortController();
  inflight.set(key, ctl);
  pending.add(key);
  VoiceState.set("thinking", roleId);
  /* your own send always shows itself — scroll preservation is for renders
     you didn't cause, not for the message you just wrote */
  if(convId === key){ renderThread(); const b = $("#thread"); b.scrollTop = b.scrollHeight; }
  renderChart(); PopOut.render(); refreshSendUI();
  let outcome = "answered";
  try{
    const reply = await Agent.reply(r, threads[key], ctl.signal, key);
    (threads[key] = threads[key] || []).push({ role:"assistant", content:reply, at:Date.now(), speaker:roleId });
    /* speak if this conversation is on screen with the speaker on, or the
       asker (ambient) asked for it outright */
    if((convId === key && tab === "chat" && ttsOn(roleId)) || (src && src.speak)) Speech.speakReply(r, reply);
  }catch(err){
    outcome = err.canceled ? "canceled" : "failed";
    if(!(err.canceled && ctl.silent)){
      (threads[key] = threads[key] || []).push(err.canceled
        ? { role:"assistant", error:true, note:true, at:Date.now(), speaker:roleId, content:"You stopped this answer." }
        : { role:"assistant", error:true, at:Date.now(), speaker:roleId, content:friendlyError(err) });
    }
  }finally{
    /* always executed — the UI can never be left waiting on a dead promise */
    pending.delete(key);
    inflight.delete(key);
    VoiceState.clear("thinking", roleId);
    touchConv(key);
    if(convId === key) renderThread();
    renderChart(); renderSide(); refreshSendUI();
    PopOut.onAnswer(key);
  }
  return outcome;
}
function sendMessage(text){
  sendTo(convId, selectedId, text, {
    input: $("#composerInput"),
    reset(){ $("#composerInput").style.height = "41px"; clearMainGhost(); }
  });
}

/* The one way in to "who am I talking to". opts.conv names the conversation
   outright (the side menu opening an old one, a reset landing on the root).
   Without it the rule is: a persona already in this conversation keeps it —
   clicking them in the chart or the picker moves the question to them rather
   than dumping you out of the thread — and anyone else brings up the
   conversation you were last having with them, or a new one.
   opts.keepDraft leaves what you have typed alone, which is what a hand-off
   inside one conversation wants: write the question, then choose who answers. */
function selectRole(id, opts){
  opts = opts || {};
  const r = roleById(id) || rootRole();
  if(!r) return;
  selectedId = r.id;
  convId = opts.conv !== undefined ? opts.conv
    : (inConv(convId, r.id) ? convId : (convForRole(r.id) || makeConv(r.id).id));
  if(!convs[convId]) makeConv(r.id, { id: convId });
  renderChart(); renderCard(); renderSide();
  const sel = $(".oRow.is-selected");
  if(sel) sel.scrollIntoView({block:"nearest"});
  /* only the main composer's draft dies with a persona switch — a pop-out
     dictation session belongs to its pinned persona and keeps running */
  if(dictTarget.main && !opts.keepDraft) discardDictation();
  Speech.stop();
  /* the recognizer captures for whichever persona is on screen (a pop-out
     dictation stays pinned to its own), so listening moves with the selection */
  if(document.body.getAttribute("data-voice") === "listening") VoiceState.set("listening", voiceListenTarget());
  refreshMic();
  refreshSpeaker();
  Ambient.refreshLang();   // ambient keeps running; the restart picks up this persona's locale
  renderAmbient();
  const input = $("#composerInput");
  if(!opts.keepDraft){ input.value = ""; input.style.height = "41px"; clearMainGhost(); }
  input.placeholder = "Message " + r.title;
  setTab(tab);
  if(innerWidth <= 900) showPane("chat");
}
/* Hand this conversation to someone else. The transcript stays; only who
   answers next changes, marked in the thread so the reader can see where one
   opinion ends and the next begins. An untouched conversation has nothing to
   hand over, so it simply becomes the other persona's. */
function switchSpeaker(id){
  const r = roleById(id);
  if(!r || id === selectedId) return;
  const t = threads[convId] || [];
  if(!t.some(m => !m.note)){ selectRole(id); return; }
  joinConv(convId, selectedId);
  joinConv(convId, id);
  t.push({ role:"assistant", note:true, error:true, at:Date.now(), speaker:id, switchTo:id,
           content:"Now asking " + r.title + "." });
  selectRole(id, { conv: convId, keepDraft: true });
  const box = $("#thread");
  box.scrollTop = box.scrollHeight;
  if(innerWidth > 900 && !$("#composerInput").disabled) $("#composerInput").focus();
}

/* =================================================================
   KNOWLEDGE SOURCES, EDITED IN THE ADMIN

   The chip row this replaces could hold one thing: a label. You
   could tell a persona that "Pricing policy" existed; you could not
   tell it what the pricing policy said, or where to read it.

   Adding a source now starts at the fork the two kinds actually
   make: a website URL, or text. Pick URL and you give it a link.
   Pick Text and you paste the material itself, as many lines as you
   like, and it goes into the brief verbatim under its own label. A
   persona can hold any mix of both, in any number — the list is
   ordered, and the order is the priority the prompt prints.

   knEditor is the whole state of this: null when the list is just a
   list, {mode:"pick"} while the fork is on screen, and a draft while
   one is being written. Typing into a draft writes into it directly
   and never re-renders, because a re-render mid-sentence takes the
   caret with it. Save commits to the role, which is what schedules
   the write-back to the Sheet.
================================================================= */
let knEditor = null;
const KN_TEXT_MAX = 45000;   // one source is one Sheet cell; a cell holds 50,000
const knDraft = (type, i) => ({ mode:type, index: typeof i === "number" ? i : null, label:"", url:"", text:"", err:"" });
function knRowHTML(k, i){
  const tag = k.type === "url" ? "url" : k.type === "text" ? "text" : "";
  const sub = k.type === "url"
    ? esc(k.url)
    : k.type === "text"
      ? esc(clip(k.text.replace(/\s+/g, " ").trim(), 120))
      : "Label only — no link and no text behind it";
  return `<div class="knRow">
      <span class="knTag ${tag}">${k.type === "url" ? "Link" : k.type === "text" ? "Text" : "Label"}</span>
      <div class="knMain">
        <div class="knName">${esc(knName(k))}</div>
        <div class="knSub">${sub}</div>
      </div>
      <div class="knActs">
        <button data-kn-edit="${i}" aria-label="Edit ${esc(knName(k))}" title="Edit">✎</button>
        <button data-kn-up="${i}" aria-label="Move ${esc(knName(k))} up" title="Move up" ${i === 0 ? "disabled style=opacity:.3" : ""}>↑</button>
        <button data-kn-remove="${i}" aria-label="Remove ${esc(knName(k))}" title="Remove">✕</button>
      </div>
    </div>`;
}
function knEditorHTML(r){
  const kn = knList(r);
  const list = kn.length
    ? `<div class="knList">${kn.map(knRowHTML).join("")}</div>`
    : `<div class="knEmpty">Nothing yet. A source is either a page this role can read, or text you paste in.</div>`;

  if(!knEditor){
    return list + `<button class="knAdd" data-kn-new>+ Add a source</button>`;
  }
  if(knEditor.mode === "pick"){
    return list + `<div class="knPick">
        <button data-kn-pick="url">Website URL<small>A page this role may read</small></button>
        <button data-kn-pick="text">Text<small>Paste the material itself</small></button>
      </div>
      <button class="knAdd" data-kn-cancel>Cancel</button>`;
  }
  const d = knEditor;
  const editing = d.index !== null;
  const form = d.mode === "url"
    ? `<div class="lab2">Website URL</div>
       <input data-kn-field="url" value="${esc(d.url)}" placeholder="https://…" autocomplete="off" spellcheck="false" inputmode="url">
       <div class="lab2">Name it (optional)</div>
       <input data-kn-field="label" value="${esc(d.label)}" placeholder="What this page is" autocomplete="off">`
    : `<div class="lab2">Name it (optional)</div>
       <input data-kn-field="label" value="${esc(d.label)}" placeholder="What this text is" autocomplete="off">
       <div class="lab2">Text</div>
       <textarea data-kn-field="text" placeholder="Paste the material. It goes into this role's brief exactly as written.">${esc(d.text)}</textarea>`;
  return list + `<div class="knForm">
      ${form}
      ${d.err ? `<div class="knErr">${esc(d.err)}</div>` : ""}
      <div class="knBtns">
        <button class="cancel" data-kn-cancel>Cancel</button>
        <button class="save" data-kn-save>${editing ? "Save changes" : "Save source"}</button>
      </div>
    </div>`;
}
/* Commit the draft. A URL is checked before it is kept — a source that isn't
   a link is worse than no source, because it reads like one in the brief. */
function knSave(){
  const r = roleById(editingId), d = knEditor;
  if(!r || !d || d.mode === "pick") return;
  const label = String(d.label || "").trim();
  let entry;
  if(d.mode === "url"){
    let url = String(d.url || "").trim();
    if(url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
    if(!HTTP_URL.test(url)){ d.err = "That doesn't look like a web address. It needs to start with http:// or https://."; renderRolePane(); return; }
    entry = { label, type:"url", url, text:"" };
  }else{
    const text = String(d.text || "");
    if(!text.trim()){ d.err = "Nothing to save yet — paste the text this role should work from."; renderRolePane(); return; }
    /* one source is one Sheet cell, and a cell holds 50,000 characters. Say so
       here rather than letting the server quietly cut the end off. */
    if(text.length > KN_TEXT_MAX){
      d.err = `That's ${text.length.toLocaleString()} characters and one source holds ${KN_TEXT_MAX.toLocaleString()}. Split it into two sources.`;
      renderRolePane(); return;
    }
    entry = { label, type:"text", url:"", text };
  }
  r.knowledge = r.knowledge || [];
  if(d.index !== null && r.knowledge[d.index]) r.knowledge[d.index] = entry;
  else r.knowledge.push(entry);
  knEditor = null;
  touchRole(r);
  renderRolePane(); refreshAfterEdit();
}

/* ========== settings: role pane ========== */
let knEditingFor = null;
function renderRolePane(){
  const r = roleById(editingId); if(!r) return;
  /* a half-written source belongs to the persona it was started on — opening
     someone else's brief closes it rather than carrying the draft across */
  if(knEditingFor !== editingId){ knEditor = null; knEditingFor = editingId; }
  const d = deptOf(r);
  const L = r.look;
  const long = (key,label,ph) => `<div class="row col"><div class="lab">${label}</div>
    <textarea class="ta" data-role-field="${key}" placeholder="${ph}">${esc(r[key]||"")}</textarea></div>`;
  /* an uninstalled saved voice shows as Automatic but keeps its value until
     the user changes it, so it revives on a device that has the voice */
  const voiceGroup = !Speech.supported() ? "" : `
    <div class="gLabel">Voice</div>

const clip = (t,n) => t.length > n ? t.slice(0, n-1).trimEnd() + "…" : t;
/* The last thing said in the conversation you were having with this persona —
   whichever of their conversations that was. Falls back to what they do. */
function previewFor(r){
  const k = convForRole(r.id);
  const t = (k && threads[k]) || [];
  if(t.length){
    const last = t[t.length-1];
    return (last.role === "user" ? "You: " : "") + clip(plainOf(last), 46);
  }
  return r.task ? clip(r.task, 46) : deptOf(r).name;
}
/* The picker does double duty. "switch" is the original: go to that persona.
   "bring" hands the open conversation to them instead, which is the same
   click with a different destination for the thread. */
let pickerMode = "switch";
function renderPicker(){
  const q = ($("#pickerQuery").value || "").trim().toLowerCase();
  const hits = state.roles.filter(r =>
    !q || r.title.toLowerCase().includes(q) || deptOf(r).name.toLowerCase().includes(q));
  if(!hits.length){
    $("#pickerList").innerHTML = `<p class="noHits">No roles match that. Try a title or a team name.</p>`;
    return;
  }
  const byDept = {};
  hits.forEach(r => (byDept[r.dept] = byDept[r.dept] || []).push(r));
  $("#pickerList").innerHTML = Object.keys(DEPTS).filter(k => byDept[k]).map(k => `
    <div class="gLabel">${DEPTS[k].name}</div>

      ${byDept[k].map(r => `<button class="row" data-pick="${r.id}">
        ${avatarSVG(r, "", 56)}
        <span class="k">${esc(r.title)}<span class="preview">${esc(
          inConv(convId, r.id) && r.id !== selectedId ? "Already in this conversation" : previewFor(r))}</span></span>
        ${selectedId === r.id ? `<span class="tick">✓</span>` : CHEV}
      </button>`).join("")}
    </div>`).join("");
}
function openPicker(mode){
  pickerMode = mode === "bring" ? "bring" : "switch";
  $("#pickerTitle").textContent = pickerMode === "bring" ? "Bring into this chat" : "Switch role";
  $("#pickerQuery").value = "";

/* ---------- sheet sync ---------- */
function connStatusText(){
  if(sheetConnected) return "Connected — personas and settings come from your Sheet.";
  if(!getToken()) return "Empty — running on built-in sample data until you paste a token.";
  return retryTimer ? "Not connected — retrying automatically." : "Not connected.";
}
const setStatus = s => { if($("#epStatus")) $("#epStatus").textContent = s; };

/* One attempt at reading the whole config and adopting it. Throws on failure
   so each caller can word its own message; on success the app is connected,
   which is what arms background sync and every write-back. */
/* what stopped the history read, when one did — the side menu says so rather
   than presenting a short list as if it were the whole of it */
let historyNote = "";
async function loadFromSheet(){
  const cfg = await sheetCall({ action:"config" });
  if(!Array.isArray(cfg.roles) || !cfg.roles.length) throw new Error("no personas in the Sheet");
  applyConfig(cfg);
  setConnected(true);
  lastWarm = Date.now();
  /* History is a separate, later concern: the personas have to exist before a
     conversation's cast can be resolved, and a Sheet that answers config but
     not history is connected — just without its past. So this never fails the
     connection, and a server too old to know the action simply has none. */
  try{ await loadHistory(); historyNote = ""; }
  catch(err){ historyNote = String(err.message || err); renderSide(); }
}

/* =================================================================
   CONNECTING IS NOT A ONE-SHOT

   A first config read fails for reasons that say nothing about whether
   the setup is right: an Apps Script cold start running past the
   timeout, a phone waking on a different network, a redeploy landing
   mid-read. That failure used to be final. Background sync and every
   persona write-back are gated on sheetConnected, and only the boot
   call ever set it — so one unlucky read left the page on sample data
   for as long as it stayed open, silently, while chat carried on
   working because it needs the token alone.

   The app now keeps trying on a widening delay for as long as a token
   exists, and stops the moment one attempt succeeds. A hidden tab waits
   to be looked at instead of spending attempts in the background, and
   both returning to the tab and regaining the network trigger an
   immediate retry — those are exactly when the earlier cause is most
   likely to have passed.
================================================================= */
const RETRY_WAITS = [5000, 10000, 20000, 40000, 60000];
/* Failures no amount of waiting resolves — a wrong or missing token, and a
   Sheet that answered but holds no personas. Everything else is treated as
   weather and retried. */
const NEEDS_A_HUMAN = /token|no personas in the Sheet/i;
let retryTimer = null, retryAt = 0, connecting = false;
function stopRetrying(){ clearTimeout(retryTimer); retryTimer = null; retryAt = 0; }
function scheduleRetry(bump = true){
  clearTimeout(retryTimer);
  if(!getToken()){ retryTimer = null; return; }
  const wait = RETRY_WAITS[Math.min(retryAt, RETRY_WAITS.length - 1)];
  if(bump) retryAt++;
  retryTimer = setTimeout(connectNow, wait);
}
/* Connects and re-renders whatever that changed. Safe to call at any time:
   overlapping calls collapse into the first, and a live conversation is
   never yanked away — the selection only moves if the Sheet no longer has
   the persona that was on screen. */
async function connectNow(){
  if(connecting) return;
  clearTimeout(retryTimer); retryTimer = null;
  if(!getToken()){ stopRetrying(); setStatus(connStatusText()); return; }
  if(document.hidden){ scheduleRetry(false); return; }
  connecting = true;
  try{
    await loadFromSheet();
    stopRetrying();
    warnedUnsaved = false;
    hideBanner();
    applyChrome(); renderChart(); renderMain();
    if(!roleById(selectedId)) selectRole(rootRole().id);
    else { renderCard(); if(tab === "chat") renderThread(); }
    syncPip();
    setStatus(connStatusText());
  }catch(err){
    setConnected(false);
    /* Retry what time can fix, and only that. A rejected token is a standing
       answer, not a blip: retrying it every minute would spend the Apps
       Script execution quota on a request that cannot start succeeding until
       someone re-pastes it. Pasting into Settings › Chat calls
       scheduleReconnect, which clears the stop. */
    if(NEEDS_A_HUMAN.test(err.message)) stopRetrying(); else scheduleRetry();
    setStatus("Couldn't connect: " + err.message + (retryTimer ? " — retrying." : ""));
  }finally{ connecting = false; }
}
addEventListener("online", () => { if(!sheetConnected && getToken()) connectNow(); });
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && !sheetConnected && getToken()) connectNow();
});

/* A settings paste restarts the attempt chain from the top, so a corrected
   token or endpoint never has to wait out the previous backoff. */
let reconnectTimer = null;
function scheduleReconnect(){
  clearTimeout(reconnectTimer);
  stopRetrying();
  setConnected(false);
  reconnectTimer = setTimeout(connectNow, 900);
}

/* Debounced write-back: one savePersona per pause in typing. */
function touchRole(r){ r.version = (r.version || 1) + 1; schedulePersonaSave(r.id); }
let saveTimer = null, savePendingId = null, warnedUnsaved = false;
function schedulePersonaSave(id){
  if(!id) return;
  /* While disconnected the roles on screen are the built-in samples, whose
     ids don't exist in the Sheet — queueing the edit would only send a write
     that must fail, and the next successful config read replaces these roles
     wholesale anyway. So say so once, plainly. Returning in silence is what
     made a lost edit look exactly like a saved one. */
  if(!sheetConnected){
    if(!warnedUnsaved){
      warnedUnsaved = true;
      showBanner("<b>Not connected — this edit stays in this browser.</b> Nothing changed here " +
        "reaches the Sheet, and the Sheet's own copy replaces it once the connection comes back. " +
        esc(connStatusText()));
    }
    return;
  }
  if(savePendingId && savePendingId !== id) flushPersonaSave();
  savePendingId = id;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushPersonaSave, 1500);
}
async function flushPersonaSave(){
  clearTimeout(saveTimer);
  const r = roleById(savePendingId);
  savePendingId = null;
  if(!r || !sheetConnected || !getToken()) return;
  const d = deptOf(r);
  try{
    const res = await sheetCall({ action:"savePersona",
      /* echoes the server's RowVersion so its conflict check has teeth;
         omitted entirely when the server never sent one (rowVersion 0) */
      rowVersion: r.rowVersion > 0 ? r.rowVersion : undefined,
      persona:{
      id:r.id, parent:r.parent, dept:r.dept, deptName:d.name, tint:d.tint,
      title:r.title || "", personality:r.personality || "", context:r.context || "",
      task:r.task || "", outcome:r.outcome || "", guardrails:r.guardrails || "",
      /* full source objects, not labels: the Sheet keeps the link and the
         pasted body in their own columns, and a save that sent labels alone
         would blank them on every edit */
      outOfScope:r.outOfScope || "", knowledge:knList(r),
      /* savePersona sends the complete persona record — leaving Language or
         Voice out would let any brief edit blank them in the Sheet */
      language:(r.language || "").trim(),
      voice:(r.voice || "").trim(),
      version:r.version || 1,
      look:{ skin:r.look.skin || "", style:r.look.style }
    }});
    if(res && res.version) r.version = Number(res.version) || r.version;
    if(res && res.rowVersion) r.rowVersion = Number(res.rowVersion) || r.rowVersion;
    /* the save kept the brief but not all of it — usually a KnowledgeSources
       tab without the SourceUrl or Content column. Saying so beats letting a
       link disappear between here and the Sheet. */
    if(res && (res.warnings || []).length){
      showBanner("<b>Saved “" + esc(r.title) + "”, with something left out.</b> " +
        res.warnings.map(esc).join(" "));
    }
  }catch(err){
    if(err.code === "CONFLICT"){
      showBanner("<b>Another device saved first.</b> “" + esc(r.title) +
        "” was updated somewhere else — reload this page to pick up the latest version, then re-apply your edit.");
    }else{
      showBanner("Couldn't save “" + esc(r.title) + "” to the Sheet (" + esc(err.message) +
        "). The edit is still in this browser.");
    }
  }
}

/* ---------- dictation wiring ---------- */
const micBtn = $("#mic"), micNoticeEl = $("#micNotice"), micStatusEl = $("#micStatus"), ghostEl = $("#composerGhost");
const voiceMeta = { dictated:false, confidences:[], target:null };
let dictAnchor = 0, dictInterimLen = 0, dictDiscard = false;
let micNoticeTimer = null, micFlashTimer = null;
/* Final results committed below this confidence get a dotted underline in the
   main composer's ghost, so the eye goes straight to what is likely wrong.
   Flag only — never a block. Spans are offsets into the composer value; any
   manual edit clears them rather than trying to remap around it, because a
   misplaced underline is worse than none. */
const LOW_CONF = 0.6;
let dictLowSpans = [];
function clearMainGhost(){
  dictLowSpans = [];
  if(!(Dictation.active && dictTarget.main && dictInterimLen)){
    ghostEl.hidden = true; ghostEl.textContent = "";
  }
}

/* Dictation writes into exactly one composer at a time. The main composer and
   the pop-out each provide a target with the same shape; whichever mic
   started the session owns the transcript until it ends. The ghost overlay is
   optional — the pop-out shows interim words as plain text instead. */
const mainDict = {
  main: true,
  roleId: null,                              // null = follow the selected persona
  get input(){ return $("#composerInput"); },
  get ghost(){ return ghostEl; },
  get mic(){ return micBtn; },
  status(msg){ micStatusEl.textContent = msg; },
  notice(msg){ micNotice(msg); },
  sync(){ syncComposer(); }
};
let dictTarget = mainDict;

function refreshMic(){ micBtn.hidden = !Dictation.supported(); }
function resetVoiceMeta(){ voiceMeta.dictated = false; voiceMeta.confidences.length = 0; voiceMeta.target = null; }
function consumeVoiceMeta(){
  const meta = { channel: voiceMeta.dictated ? "voice" : "chat" };
  if(voiceMeta.dictated && voiceMeta.confidences.length){
    meta.confidence = Math.round(voiceMeta.confidences.reduce((a, b) => a + b, 0) / voiceMeta.confidences.length * 1000) / 1000;
  }
  resetVoiceMeta();
  return meta;
}
/* stop listening AND drop anything still in flight — used when the draft the
   session was dictating into no longer exists (send, role switch) */
function discardDictation(){
  if(Dictation.active){ dictDiscard = true; Dictation.stop(); }
  Cleanup.gen++;   // a pending cleanup reply must not land in a recycled composer
  resetVoiceMeta();
  dictAnchor = 0; dictInterimLen = 0;
  dictLowSpans = [];
  if(dictTarget.ghost){ dictTarget.ghost.hidden = true; dictTarget.ghost.textContent = ""; }
}
function micNotice(msg){
  clearTimeout(micNoticeTimer);
  micNoticeEl.className = "micNotice";
  micNoticeEl.textContent = msg;
  micNoticeEl.hidden = false;
  micNoticeTimer = setTimeout(() => { micNoticeEl.hidden = true; }, 4500);
}
function syncComposer(){
  const el = $("#composerInput");
  el.style.height = "41px";
  el.style.height = Math.min(el.scrollHeight, 124) + "px";
  refreshSendUI();
}
/* The ghost mirrors the textarea so ranges can be styled where a textarea
   can't: committed text is transparent (the textarea shows it), the interim
   span paints over its own glyphs in a lighter color, and low-confidence
   committed spans draw only a dotted underline (their glyphs stay
   transparent — the decoration has its own color). The ghost persists after
   dictation ends while underlines remain, and clears on edit, send, cleanup,
   or persona switch. */
function renderGhost(){
  const g = dictTarget.ghost;
  if(!g) return;
  const el = dictTarget.input;
  const spans = dictTarget.main ? dictLowSpans : [];
  if(!dictInterimLen && !spans.length){ g.hidden = true; g.textContent = ""; return; }
  const v = el.value;
  const marks = spans.filter(s => s.start < s.end && s.end <= v.length)
    .map(s => ({ s: s.start, e: s.end, c: "lowc" }));
  if(dictInterimLen) marks.push({ s: dictAnchor, e: dictAnchor + dictInterimLen, c: "int" });
  marks.sort((a, b) => a.s - b.s);
  let html = "", at = 0;
  marks.forEach(m => {
    if(m.s < at || m.e > v.length) return;
    html += esc(v.slice(at, m.s)) + `<span class="${m.c}">` + esc(v.slice(m.s, m.e)) + "</span>";
    at = m.e;
  });
  html += esc(v.slice(at));
  g.innerHTML = html;
  g.hidden = false;
  g.scrollTop = el.scrollTop;
}
function spacedForInsert(text){
  const before = dictTarget.input.value.slice(0, dictAnchor);
  const t = text.replace(/^\s+/, "");
  return before && !/\s$/.test(before) && t ? " " + t : t;
}
/* Replace the current interim range with `insert`; committing advances the
   anchor so dictation appends at the cursor and never wipes typed text. */
function setDictText(insert, commit){
  const el = dictTarget.input, v = el.value;
  el.value = v.slice(0, dictAnchor) + insert + v.slice(dictAnchor + dictInterimLen);
  if(commit){ dictAnchor += insert.length; dictInterimLen = 0; }
  else dictInterimLen = insert.length;
  const caret = dictAnchor + dictInterimLen;
  try{ el.setSelectionRange(caret, caret); }catch(e){}
  dictTarget.sync();
  renderGhost();
}

/* =================================================================
   CLEANUP — one cheap-model pass over a finished dictation.
   Web Speech returns unpunctuated run-on text; when a dictation
   session ends with a draft still in the composer, one bounded call
   (action:"cleanup", 2s ceiling) asks the server for punctuation,
   capitalisation, and vocabulary correction ONLY — explicitly no
   rewriting, summarising, or added/removed content. The reply
   replaces the draft only if the draft hasn't changed meanwhile and
   only if it still reads as the same words (a word-distance gate
   refuses a rewrite the instruction should have prevented), with an
   Undo affordance that restores the raw text. Any failure or
   slowness keeps the raw transcript and moves on — this never
   blocks sending.
================================================================= */
const CLEANUP_TIMEOUT_MS = 2000;
const Cleanup = {
  gen: 0,
  run(target){
    const input = target.input;
    if(!input || !getToken()) return;
    const raw = input.value;
    if(!raw.trim()) return;
    const role = roleById(target.roleId || selectedId);
    if(!role) return;
    const gen = ++this.gen;
    const lex = roleLexicon(role);
    const vocabulary = [...new Set([].concat(
      VOCAB_RULES.map(r => r.value),
      lex.terms.map(x => x.t)
    ))].slice(0, 40);
    sheetCall({
      action: "cleanup",
      roleId: role.id,
      language: String(role.language || "").trim() || "en-US",
      transcript: raw,
      vocabulary,
      instruction: "Add punctuation and capitalisation to this dictated transcript, and correct words only where they clearly match the vocabulary list. Never rewrite, rephrase, summarise, or add or remove content — every word stays unless it is a vocabulary correction. Return only the corrected text."
    }, { timeoutMs: CLEANUP_TIMEOUT_MS })
    .then(data => {
      if(gen !== this.gen || Dictation.active) return;
      const text = String((data && (data.text || data.reply || data.result)) || "").trim();
      if(!text || text === raw) return;
      if(input.value !== raw) return;                 // edited or sent while we waited
      const rawToks = werTokens(raw);
      if(wordEditDistance(rawToks, werTokens(text)) > Math.max(2, Math.ceil(rawToks.length * 0.3))) return;
      if(target.main) dictLowSpans = remapLowSpans(dictLowSpans, raw, text);
      input.value = text;
      target.sync();
      if(target.main) renderGhost();
      this.offerUndo(target, raw, text);
    })
    .catch(() => {});   // the raw text stands; dictation never waits on this
  },
  offerUndo(target, raw, cleaned){
    const undo = () => {
      const input = target.input;
      if(input && input.value === cleaned){
        input.value = raw;
        if(target.main) clearMainGhost();
        target.sync();
      }
    };
    const wire = (el, after) => {
      el.innerHTML = `Tidied punctuation and vocabulary. <button type="button">Undo</button>`;
      el.hidden = false;
      el.querySelector("button").addEventListener("click", () => { undo(); el.hidden = true; after && after(); });
    };
    if(target.main){
      clearTimeout(micNoticeTimer);
      micNoticeEl.className = "micNotice info";
      wire(micNoticeEl, () => { micNoticeEl.className = "micNotice"; });
      micNoticeTimer = setTimeout(() => { micNoticeEl.hidden = true; micNoticeEl.className = "micNotice"; }, 8000);
    }else if(PopOut.win && target === PopOut.dict){
      wire(PopOut.els.notice);
      clearTimeout(PopOut._nT);
      PopOut._nT = setTimeout(() => { if(PopOut.els) PopOut.els.notice.hidden = true; }, 8000);
    }
  }
};
/* best-effort: carry each underline over to the cleaned text by finding its
   words again; a span whose words the cleanup reshaped just drops its flag */
function remapLowSpans(spans, raw, cleaned){
  const low = cleaned.toLowerCase();
  let from = 0;
  const out = [];
  spans.forEach(s => {
    const needle = raw.slice(s.start, s.end).trim().toLowerCase();
    if(!needle) return;
    const i = low.indexOf(needle, from);
    if(i < 0) return;
    out.push({ start: i, end: i + needle.length });
    from = i + needle.length;
  });
  return out;
}

/* an echo verdict also clears any interim words the echo already painted,
   otherwise they'd sit in the box and commit as text when listening ends */
Dictation.onInterim = t => {
  if(dictDiscard) return;
  if(EchoGuard.isEcho(t)){ if(dictInterimLen) setDictText("", false); return; }
  setDictText(t.trim() ? spacedForInsert(t) : "", false);
};
Dictation.onFinal = (t, conf) => {
  if(dictDiscard || !t.trim()) return;
  if(EchoGuard.isEcho(t)){ if(dictInterimLen) setDictText("", false); return; }
  const ins = spacedForInsert(t);
  const at = dictAnchor;
  setDictText(ins, true);
  /* flag, never block: a low-confidence commit gets a dotted underline in the
     main composer (conf 0 means "unknown" in Chrome — no flag on a guess) */
  if(dictTarget.main && typeof conf === "number" && conf > 0 && conf < LOW_CONF){
    const lead = ins.length - ins.replace(/^\s+/, "").length;
    dictLowSpans.push({ start: at + lead, end: at + ins.length });
    renderGhost();
  }
  voiceMeta.dictated = true;
  voiceMeta.target = dictTarget.input;
  if(typeof conf === "number" && conf > 0) voiceMeta.confidences.push(conf);
};
Dictation.onState = s => {
  const listening = s === "listening";
  /* the clear falls back to "listening" while ambient is still armed, so
     handing the mic back after dictation never flickers the state off */
  if(listening) VoiceState.set("listening", dictTarget.roleId || selectedId);
  else VoiceState.clear("listening");
  const mic = dictTarget.mic;
  if(mic){
    mic.classList.toggle("listening", listening);
    mic.setAttribute("aria-pressed", String(listening));
    mic.setAttribute("aria-label", listening ? "Stop dictation" : "Start dictation");
  }
  if(listening){
    if(mic) mic.classList.remove("flash");
    Cleanup.gen++;   // a new session owns the composer; stale cleanup replies die here
    const el = dictTarget.input;
    dictAnchor = el.selectionStart ?? el.value.length;
    dictInterimLen = 0;
    dictTarget.status("Listening. Tap the microphone again to stop.");
  }else{
    /* interim words still on screen stay put as normal text — never wipe */
    if(dictInterimLen){ dictAnchor += dictInterimLen; dictInterimLen = 0; voiceMeta.dictated = true; voiceMeta.target = dictTarget.input; }
    renderGhost();
    /* a session that ended with a dictated draft still in its composer gets
       the punctuation pass; a discarded or errored one doesn't */
    const finished = !dictDiscard && !Dictation._erred && voiceMeta.dictated &&
      voiceMeta.target === dictTarget.input && !!dictTarget.input.value.trim();
    dictDiscard = false;
    if(!Dictation._erred) dictTarget.status("Dictation stopped.");
    if(finished) Cleanup.run(dictTarget);
    Ambient.resumeAfterDictation();   // give the recognition slot back
  }
};
Dictation.onError = msg => {
  dictTarget.notice(msg);
  dictTarget.status(msg);
  const mic = dictTarget.mic;
  if(mic){
    clearTimeout(micFlashTimer);
    mic.classList.remove("listening");
    mic.classList.add("flash");
    micFlashTimer = setTimeout(() => mic.classList.remove("flash"), 700);
  }
};
micBtn.addEventListener("click", () => {
  if(Dictation.active){ Dictation.stop(); return; }
  if(VoiceTest.running){ micNotice("The voice accuracy test is using the microphone — stop it first."); return; }
  dictTarget = mainDict;
  micNoticeEl.hidden = true;
  Speech.stop();                 // pressing the mic means you want to talk, not listen to us
  Ambient.pauseForDictation();   // one recognition slot: ambient yields to dictation
  Dictation.start();
});

/* ---------- speech wiring ---------- */
const speakBtn = $("#speakBtn");
function refreshSpeaker(){
  speakBtn.hidden = !Speech.supported();
  const on = ttsOn(selectedId);
  speakBtn.classList.toggle("on", on);
  speakBtn.setAttribute("aria-pressed", String(on));
}
speakBtn.addEventListener("click", () => {
  const on = !ttsOn(selectedId);
  setTtsOn(selectedId, on);
  if(!on) Speech.stop();
  refreshSpeaker();
});
if(Speech.supported()){
  Speech.refreshVoices();
  /* voices arrive asynchronously in Chrome */
  speechSynthesis.onvoiceschanged = () => Speech.refreshVoices();
}

/* =================================================================
   SIDE MENU — every conversation you have ever had, in the rail.

   The list is the union of two sources and shows no seam between
   them: conversations live in this browser, and conversations the
   Sheet knows about. A Sheet one arrives as a summary — title, cast,
   counts, times — and loads its transcript the first time it is
   opened, so boot costs one call no matter how much history exists.

   Because the Sheet is the store, history is no longer a property of
   this tab. Reload, switch device, clear the browser: the list is
   the same, because Interactions and Messages are the same. What
   this file holds is a cache of them plus whatever has not been
   sent yet.

   Search covers both halves honestly. Titles and any transcript
   already in memory are matched here, instantly, as you type; the
   full text of everything else is matched by the server against the
   Messages tab, which is the only place that text exists. The two
   result sets are merged, so one query reaches a question asked
   months ago on another machine.

   The Team pane is the org outline that used to be the whole rail —
   it starts a conversation, where the Chats pane returns to one.
================================================================= */
const sideState = { pane:"chats", q:"", hits:null, hitsFor:"", editing:null, confirming:null, loading:false, error:"" };

function showMenu(){
  document.body.classList.add("menu-open");
  $("#menuBtn").setAttribute("aria-expanded", "true");
  if(innerWidth <= 900) $("#scrim").classList.add("on");
}
function closeMenu(){
  document.body.classList.remove("menu-open");
  $("#menuBtn").setAttribute("aria-expanded", String(innerWidth > 900 && !document.body.classList.contains("rail-off")));
  if(!$("#sheet").classList.contains("on") && !$("#picker").classList.contains("on") && !chartOpen())
    $("#scrim").classList.remove("on");
}
/* One button, two jobs, because the menu means different things on the two
   layouts: on a phone it is a drawer over the chat, on a desktop it is the
   column beside it, and hiding that column is what "close" means there. */
function toggleMenu(){
  if(innerWidth <= 900){
    document.body.classList.contains("menu-open") ? closeMenu() : showMenu();
    return;
  }
  const off = document.body.classList.toggle("rail-off");
  $("#menuBtn").setAttribute("aria-expanded", String(!off));
  if(!off) renderSide();
}
function setSidePane(pane){
  sideState.pane = pane;
  $("#sideSwitch").classList.toggle("b", pane === "team");
  $("#sideSwitch").querySelectorAll("[data-side]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.side === pane)));
  $("#paneChats").hidden = pane !== "chats";
  $("#paneTeam").hidden = pane !== "team";
  $("#sideSearchRow").hidden = pane !== "chats";
  if(pane === "chats") renderSide();
}

/* ---------- when a conversation happened ---------- */
const startOfDay = ts => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
function dayGroup(ts){
  const days = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
  if(days <= 0) return "Today";
  if(days === 1) return "Yesterday";
  if(days < 7) return "Previous 7 days";
  if(days < 30) return "Previous 30 days";
  return new Date(ts).toLocaleDateString([], { month:"long", year:"numeric" });
}
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
function whenLabel(ts){
  const g = dayGroup(ts);
  return g === "Today" ? fmtTime(ts)
    : g === "Yesterday" ? "Yesterday"
    : new Date(ts).toLocaleDateString([], { month:"short", day:"numeric" });
}
/* "Head of Marketing and General Counsel" — the cast of one conversation */
function castLabel(ids){
  const names = (ids || []).map(id => roleById(id)).filter(Boolean).map(r => r.title);
  if(!names.length) return "";
  if(names.length === 1) return names[0];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}
function snippetHTML(text, q){
  /* Marks are noise in a two-line preview, so they come out — unless taking
     them out takes the match with them, in which case showing where the hit
     actually is matters more than showing it cleanly. */
  const bare = stripMarkdown(splitReply(text).written || text).replace(/\s+/g, " ").trim();
  const plain = (!q || bare.toLowerCase().includes(q)) && bare
    ? bare : String(text).replace(/\s+/g, " ");
  const i = q ? plain.toLowerCase().indexOf(q) : -1;
  if(i < 0) return esc(clip(plain, 70));
  const start = Math.max(0, i - 22);
  return (start ? "…" : "") + esc(plain.slice(start, i)) +
    "<mark>" + esc(plain.slice(i, i + q.length)) + "</mark>" +
    esc(clip(plain.slice(i + q.length), 46));
}

/* ---------- the list ---------- */
const CAST_FACES = 3;
/* `meta` is the second line, already HTML — a snippet with the search term
   marked, or the plain who-and-when line. `titleHTML` overrides the first line
   the same way, so a conversation matched by its NAME shows you where. */
function convRowHTML(c, meta, titleHTML){
  const cast = castOf(c.id);
  const tint = deptOf(roleById(cast[0]) || roleById(c.root) || { dept:"" }).tint;
  const faces = cast.slice(0, CAST_FACES).map(id => avatarSVG(roleById(id), "", 26)).join("") +
    (cast.length > CAST_FACES ? `<span class="cMore">+${cast.length - CAST_FACES}</span>` : "");
  return `<div class="cRowWrap">
      <button class="cRow ${c.id === convId ? "on" : ""}" style="--tint:${tint}"
        data-open="${esc(c.id)}" ${c.id === convId ? 'aria-current="true"' : ""}>
        <span class="cFaces">${faces || avatarSVG(roleById(c.root) || state.roles[0], "", 26)}</span>
        <span class="cText"><span class="cTitle">${titleHTML || esc(convTitle(c.id))}</span>
          <span class="cMeta">${meta}</span></span>
        ${c.loading ? `<span class="cSpin" aria-label="Opening"></span>` : ""}
      </button>
      <div class="cActs">
        <button data-rename="${esc(c.id)}" aria-label="Rename this conversation" title="Rename">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="M14.5 5.5l4 4"/></svg>
        </button>
        <button class="danger" data-del="${esc(c.id)}" aria-label="Delete this conversation" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.5 7V5h5v2M7 7l.8 12h8.4L17 7"/></svg>
        </button>
      </div>
    </div>`;
}
/* The meta line answers "which of my conversations is this?" — who was in it,
   how long it ran, and when it was last touched. */
function convMeta(c){
  const cast = castOf(c.id);
  const who = cast.length > 1 ? castLabel(cast) : (roleById(cast[0]) || {}).title || "Removed role";
  const n = c.loaded ? (threads[c.id] || []).filter(m => !m.note).length : c.messageCount;
  const bits = [esc(who)];
  if(n) bits.push(n + " message" + (n === 1 ? "" : "s"));
  bits.push(esc(whenLabel(c.updatedAt)));
  return bits.join(" · ");
}
function renderSide(){
  if(sideState.pane !== "chats") return;
  const list = $("#paneChats");
  if(!list) return;
  const q = sideState.q;

  if(sideState.editing) return renderSideEditing(list);

  const all = convsSorted();
  if(q) return renderSideSearch(list, all, q);

  if(!all.length){
    list.innerHTML = `<p class="sideNote"><b>No conversations yet</b>
      Pick someone in Team and ask them something. Every conversation is saved
      to your Google Sheet, so it will still be here tomorrow.</p>`;
    return;
  }
  let out = "", group = "";
  all.forEach(c => {
    const g = dayGroup(c.updatedAt);
    if(g !== group){ group = g; out += `<div class="cLabel">${esc(g)}</div>`; }
    out += c.id === sideState.confirming ? confirmRowHTML(c) : convRowHTML(c, convMeta(c));
  });
  list.innerHTML = out + sideFootHTML(all.length);
}
function confirmRowHTML(c){
  return `<div class="cConfirm"><b>Delete “${esc(convTitle(c.id))}”?</b>
      <button data-cancel-del>Keep</button>
      <button class="danger" data-do-del="${esc(c.id)}">Delete</button>
    </div>`;
}
function renderSideEditing(list){
  const c = convs[sideState.editing];
  if(!c){ sideState.editing = null; return renderSide(); }
  const all = convsSorted();
  let out = "", group = "";
  all.forEach(x => {
    const g = dayGroup(x.updatedAt);
    if(g !== group){ group = g; out += `<div class="cLabel">${esc(g)}</div>`; }
    out += x.id === c.id
      ? `<div class="cEdit"><input id="cEditInput" value="${esc(convTitle(c.id))}"
           aria-label="Conversation name" maxlength="80"></div>`
      : convRowHTML(x, convMeta(x));
  });
  list.innerHTML = out + `<p class="sideFoot">Enter saves, Escape cancels.</p>`;
  const input = $("#cEditInput");
  if(input){ input.focus(); input.select(); }
}
/* The list has to say which of the two it is showing — everything in the
   Sheet, or only what this browser happens to hold — because the difference is
   invisible and the second one looks exactly like a short history. */
function sideFootHTML(n){
  if(!getToken()) return `<p class="sideFoot">Not connected to your Sheet, so these ${n}
    conversation${n === 1 ? "" : "s"} live in this browser only. Add your access token in
    Settings › Chat to keep them.</p>`;
  if(historyNote) return `<p class="sideFoot">This browser's conversations only — reading the
    rest from your Sheet failed: ${esc(historyNote.replace(/\.\s*$/, ""))}. It retries on its own.</p>`;
  if(!sheetConnected) return `<p class="sideFoot">Loaded from this browser. The Sheet isn't
    answering right now, so conversations saved on other devices aren't listed.</p>`;
  return `<p class="sideFoot">${n} conversation${n === 1 ? "" : "s"}, saved in your Google Sheet.</p>`;
}

/* ---------- search ---------- */
/* Local first, always: titles and any transcript in memory match while you
   type. The server's pass over the Messages tab lands a moment later and adds
   everything this browser has never held — the two are merged, newest first,
   and a conversation matched by both is listed once. */
function renderSideSearch(list, all, q){
  /* Server hits are indexed first so a conversation matched both ways is listed
     once, with the better evidence — an actual line from it — rather than
     whichever source happened to be checked first. Only the hits belonging to
     THIS query count: the previous query's results are still in hand while a
     new one is in flight, and reusing them lists conversations that match
     nothing you typed. */
  const remote = {};
  if(sideState.hitsFor === q) (sideState.hits || []).forEach(h => { if(h && h.id) remote[h.id] = h; });
  const rows = [];
  all.forEach(c => {
    const title = convTitle(c.id);
    const inTitle = title.toLowerCase().includes(q);
    const local = (threads[c.id] || []).find(m => !m.note && String(m.content).toLowerCase().includes(q));
    const hit = remote[c.id];
    /* a snippet that no longer contains the query proves nothing — drop it */
    const said = local ? String(local.content)
      : (hit && String(hit.snippet || "").toLowerCase().includes(q) ? String(hit.snippet) : "");
    if(!said && !inTitle) return;
    rows.push(convRowHTML(c,
      said ? snippetHTML(said, q) : convMeta(c),
      inTitle ? snippetHTML(title, q) : null));
  });
  const note = sideState.loading
    ? `<p class="sideFoot">Searching everything in your Sheet…</p>`
    : sideState.error
      ? `<p class="sideFoot">Searched this browser only — the Sheet said: ${esc(sideState.error)}</p>`
      : sideState.hitsFor === q
        ? `<p class="sideFoot">Searched every message in your Sheet.</p>`
        : "";
  list.innerHTML = rows.length
    ? `<div class="cLabel">${rows.length} conversation${rows.length === 1 ? "" : "s"}</div>` + rows.join("") + note
    : (sideState.loading ? `<p class="sideNote"><b>Searching…</b>Looking through your Sheet.</p>`
                         : `<p class="sideNote"><b>Nothing matches that</b>${sideState.error ? esc(sideState.error) : "Try fewer words."}</p>`);
}
let searchTimer = null, searchGen = 0;
function onSearchInput(){
  sideState.q = ($("#sideQuery").value || "").trim().toLowerCase();
  sideState.confirming = null;
  sideState.editing = null;
  clearTimeout(searchTimer);
  if(!sideState.q){
    sideState.hits = null; sideState.hitsFor = ""; sideState.loading = false; sideState.error = "";
    renderSide();
    return;
  }
  /* short queries match too much to be worth a round trip; local still runs */
  if(sideState.q.length < 3 || !getToken()){ renderSide(); return; }
  sideState.loading = true;
  renderSide();
  searchTimer = setTimeout(() => runSearch(sideState.q), 260);
}
async function runSearch(q){
  const gen = ++searchGen;
  try{
    const data = await sheetCall({ action:"searchConversations", q, limit:60 }, { timeoutMs:20000 });
    if(gen !== searchGen) return;                      // a newer query is already out
    sideState.hits = data.hits || [];
    sideState.hitsFor = q;
    sideState.error = "";
    /* A hit can name a conversation this browser has never seen — the summary
       rides along on the hit so it can be listed and opened like any other. */
    (sideState.hits || []).forEach(h => {
      if(convs[h.id] || !h.id) return;
      makeConv(h.personaId || (h.participantIds || [])[0] || "", {
        id: h.id, title: h.title || "", participantIds: h.participantIds || [],
        createdAt: Date.parse(h.startedAt) || Date.now(),
        updatedAt: Date.parse(h.updatedAt) || Date.now(),
        messageCount: h.messageCount || 0, remote: true, loaded: false
      });
    });
  }catch(err){
    if(gen !== searchGen) return;
    sideState.hits = null;
    sideState.error = String(err.message || "search failed");
  }finally{
    if(gen === searchGen){ sideState.loading = false; renderSide(); }
  }
}

/* ---------- reading the Sheet's history ---------- */
/* One summary call. Conversations this browser already has keep their local
   messages — they are the same conversation, and the copy in memory may hold a
   turn the Sheet has not caught up with — but take the Sheet's title and its
   proof that a row exists. */
async function loadHistory(){
  if(!getToken()) return;
  lastHistoryRead = Date.now();
  const data = await sheetCall({ action:"history", limit:150 }, { timeoutMs:25000 });
  (data.conversations || []).forEach(c => {
    if(!c || !c.id) return;
    const cast = (c.participantIds || []).filter(Boolean);
    const known = convs[c.id];
    if(known){
      if(c.title) known.title = c.title;
      known.remote = true;
      if(!known.loaded) known.messageCount = c.messageCount || known.messageCount;
      if(cast.length) cast.forEach(id => joinConv(c.id, id));
      return;
    }
    makeConv(c.personaId || cast[0] || "", {
      id: c.id, title: c.title || "", participantIds: cast,
      createdAt: Date.parse(c.startedAt) || Date.now(),
      updatedAt: Date.parse(c.updatedAt) || Date.parse(c.startedAt) || Date.now(),
      messageCount: c.messageCount || 0, remote: true, loaded: false
    });
  });
  renderSide();
  return data;
}
/* Open a conversation, fetching its transcript first if this is the first time
   it has been looked at. The messages come back with the persona who wrote
   each one, which is what rebuilds the cast — and therefore what lets a
   conversation reopened weeks later keep being handed between people. */
async function openConv(k){
  const c = convs[k];
  if(!c) return;
  if(!c.loaded){
    if(c.loading) return;
    c.loading = true; renderSide();
    try{
      const data = await sheetCall({ action:"transcript", interactionId:k }, { timeoutMs:25000 });
      const msgs = (data.messages || []).map(m => ({
        role: m.role === "assistant" ? "assistant" : "user",
        content: String(m.content || ""),
        at: Date.parse(m.at) || c.updatedAt,
        /* the Sheet logs PersonaId on both sides of a turn: who wrote the
           answer, and who the question was put to */
        speaker: m.role === "assistant" ? (m.personaId || undefined) : undefined,
        to: m.role === "user" ? (m.personaId || undefined) : undefined,
        channel: m.channel, confidence: m.confidence
      }));
      threads[k] = msgs;
      const meta = data.conversation || {};
      const cast = (meta.participantIds || []).filter(roleById);
      participants[k] = (cast.length ? cast : castFromMessages(msgs, c.root)).filter(Boolean);
      if(meta.title) c.title = meta.title;
      c.messageCount = msgs.filter(m => !m.note).length;
      c.loaded = true;
    }catch(err){
      c.loading = false;
      renderSide();
      showBanner("<b>Couldn't open that conversation</b> — " +
        esc(String(err.message).replace(/\.\s*$/, "")) + ". It is still in your Sheet; try again in a moment.");
      return;
    }
    c.loading = false;
  }
  dropEmptyConvs(k);
  selectRole(lastSpeaker(k), { conv: k });
  renderSide();
  if(innerWidth <= 900) closeMenu();
}

/* ---------- rename and delete ---------- */
async function renameConv(k, title){
  const c = convs[k];
  if(!c) return;
  const next = String(title || "").replace(/\s+/g, " ").trim().slice(0, 80);
  if(!next || next === c.title) return;
  const was = c.title;
  c.title = next;
  renderSide();
  if(!c.remote || !getToken()) return;         // nothing to write back yet
  try{
    await sheetCall({ action:"renameConversation", interactionId:k, title:next }, { timeoutMs:20000 });
  }catch(err){
    c.title = was;
    renderSide();
    showBanner("<b>That rename didn't reach the Sheet</b> — " +
      esc(String(err.message).replace(/\.\s*$/, "")) + ". The old name is back.");
  }
}
/* Deleting stops a conversation being listed, here and in the Sheet, where the
   row is marked deleted rather than removed — the messages stay logged. A
   conversation that never reached the Sheet is only ever local, so it just goes. */
async function deleteConv(k){
  const c = convs[k];
  if(!c) return;
  const remote = c.remote && getToken();
  const wasCurrent = k === convId;
  const snapshot = { c, messages: threads[k], cast: participants[k] };
  delete convs[k]; delete threads[k]; delete participants[k];
  sideState.confirming = null;
  if(wasCurrent){
    const next = convsSorted()[0];
    next ? selectRole(lastSpeaker(next.id), { conv: next.id }) : selectRole(selectedId, { conv: undefined });
  }
  renderSide(); renderChart(); PopOut.render();
  if(!remote) return;
  try{
    await sheetCall({ action:"deleteConversation", interactionId:k }, { timeoutMs:20000 });
  }catch(err){
    /* put it back rather than leave the list lying about what the Sheet holds */
    convs[k] = snapshot.c;
    threads[k] = snapshot.messages;
    participants[k] = snapshot.cast;
    renderSide();
    showBanner("<b>That delete didn't reach the Sheet</b> — " +
      esc(String(err.message).replace(/\.\s*$/, "")) + ". The conversation is back in the list.");
  }
}

/* ---------- wiring ---------- */
$("#menuBtn").addEventListener("click", toggleMenu);
$("#newChat").addEventListener("click", () => newChat(selectedId));
$("#sideSwitch").addEventListener("click", e => {
  const b = e.target.closest("[data-side]");
  if(b) setSidePane(b.dataset.side);
});
$("#sideQuery").addEventListener("input", onSearchInput);
$("#sideQuery").addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("#sideQuery").value = ""; onSearchInput(); }
});
$("#paneChats").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if(del){ sideState.confirming = del.dataset.del; sideState.editing = null; renderSide(); return; }
  const go = e.target.closest("[data-do-del]");
  if(go){ deleteConv(go.dataset.doDel); return; }
  if(e.target.closest("[data-cancel-del]")){ sideState.confirming = null; renderSide(); return; }
  const ren = e.target.closest("[data-rename]");
  if(ren){ sideState.editing = ren.dataset.rename; sideState.confirming = null; renderSide(); return; }
  const open = e.target.closest("[data-open]");
  if(open) openConv(open.dataset.open);
});
$("#paneChats").addEventListener("keydown", e => {
  if(!e.target.matches("#cEditInput")) return;
  if(e.key === "Enter"){
    const k = sideState.editing;
    sideState.editing = null;
    renameConv(k, e.target.value);
  }else if(e.key === "Escape"){
    sideState.editing = null;
    renderSide();
  }
});
$("#paneChats").addEventListener("focusout", e => {
  /* clicking away commits, the same as Enter — losing a rename to a stray
     click is the kind of small betrayal that stops people naming things */
  if(!e.target.matches("#cEditInput") || !sideState.editing) return;
  const k = sideState.editing, v = e.target.value;
  sideState.editing = null;
  renameConv(k, v);
  renderSide();
});
$("#paneTeam").addEventListener("click", () => { if(innerWidth <= 900) closeMenu(); });
/* The desktop rail is always open; the mobile drawer starts closed. Crossing
   the breakpoint has to reset that, or a drawer left open on a phone becomes a
   permanently hidden column on the desktop it was resized into. */
addEventListener("resize", () => {
  if(innerWidth > 900) document.body.classList.remove("menu-open");
  $("#menuBtn").setAttribute("aria-expanded", String(
    innerWidth > 900 ? !document.body.classList.contains("rail-off")
                     : document.body.classList.contains("menu-open")));
});

/* =================================================================
   POP-OUT — a floating always-on-top chat via Document Picture-in-
   Picture (Chrome 116+). The window is pinned to the persona it was
   opened for: switching personas in the main app doesn't retarget
   it, so one thread can float while you browse the rest of the org.
   Clicking the pop-out button again re-pins it to the now-current
   persona.

   The pop-out DOM is built fresh, from state, inside the PiP
   window's own document — nodes are never moved out of the main
   app, because any main-app re-render would orphan them. Where the
   API is missing, the control never shows at all.

   Collapse swaps the thread for a badge counting answers that land
   while collapsed; a new answer auto-expands the window. resizeTo

const PopOut = {
  win:null, convId:null, roleId:null, collapsed:false, missed:0, els:null, dict:null, _nT:null,
  supported(){ return "documentPictureInPicture" in window; },
  async open(key, roleId){
    if(!this.supported()) return;
    if(this.win){ this.pin(key, roleId); try{ this.win.focus(); }catch(e){} return; }
    let win;
    try{ win = await documentPictureInPicture.requestWindow({ width:380, height:560 }); }
    catch(err){ showBanner("Couldn't open the pop-out chat (" + esc(err.message) + ")."); return; }
    this.win = win; this.collapsed = false; this.missed = 0;
    const doc = win.document;
    const style = doc.createElement("style");
    style.textContent = PIP_CSS;
    doc.head.appendChild(style);
    doc.body.innerHTML = `
      <header class="head">
        <span id="pAvatar"></span>
        <div class="meta"><b id="pTitle"></b><span id="pDept"></span></div>
        <button class="hBtn" id="pCollapse" title="Collapse" aria-label="Collapse">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
      </header>
      <div class="badgeView"><button id="pExpand" aria-label="Expand">
        <span class="count" id="pCount">0</span>
        <span class="lbl">answers while collapsed — click to open</span>
      </button></div>
      <div class="thread" id="pThread"></div>
      <div class="composer">
        <div class="notice" id="pNotice" hidden></div>
        <textarea id="pInput" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button class="cBtn" id="pMic" hidden aria-label="Start dictation" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <button class="cBtn" id="pCopy" title="Copy the last answer" aria-label="Copy the last answer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>
        </button>
        <button class="cBtn primary" id="pSend" disabled aria-label="Send">
          <svg id="pSendIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg id="pStopIco" viewBox="0 0 24 24" hidden><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/></svg>
        </button>
      </div>`;
    const q = s => doc.querySelector(s);
    this.els = {
      doc, avatar:q("#pAvatar"), title:q("#pTitle"), dept:q("#pDept"),
      thread:q("#pThread"), input:q("#pInput"), mic:q("#pMic"), copy:q("#pCopy"),
      send:q("#pSend"), sendIco:q("#pSendIco"), stopIco:q("#pStopIco"),
      notice:q("#pNotice"), collapse:q("#pCollapse"), count:q("#pCount"), expand:q("#pExpand")
    };
    this.dict = {
      main:false,
      get roleId(){ return PopOut.roleId; },
      get input(){ return PopOut.els && PopOut.els.input; },
      ghost:null,
      get mic(){ return PopOut.els && PopOut.els.mic; },
      status(){},
      notice(msg){ PopOut.flashNotice(msg); },
      sync(){ PopOut._syncInput(); }
    };
    this.els.input.addEventListener("input", () => {
      this._syncInput();
      if(Dictation.active && dictTarget === this.dict){
        dictAnchor = this.els.input.selectionStart ?? this.els.input.value.length;
        dictInterimLen = 0;
      }
      if(!this.els.input.value.trim() && voiceMeta.target === this.els.input) resetVoiceMeta();
    });
    this.els.input.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); this.send(); }
    });
    this.els.send.addEventListener("click", () => {
      if(pending.has(this.convId)) cancelAnswer(this.convId);
      else this.send();
    });
    this.els.mic.hidden = !Dictation.supported();
    this.els.mic.addEventListener("click", () => {
      if(Dictation.active){ Dictation.stop(); return; }
      if(VoiceTest.running){ this.flashNotice("The voice accuracy test is using the microphone — stop it first."); return; }
      dictTarget = this.dict;
      this.els.notice.hidden = true;
      Speech.stop();
      Ambient.pauseForDictation();
      Dictation.start();
    });
    this.els.copy.addEventListener("click", () => this.copyLast());
    this.els.collapse.addEventListener("click", () => this.setCollapsed(!this.collapsed));
    this.els.expand.addEventListener("click", () => this.setCollapsed(false));
    win.addEventListener("pagehide", () => this._closed());
    this.pin(key, roleId);
    refreshPipBtn();
  },
  /* (re)bind the window to a conversation and the persona answering in it,
     then paint everything from state */
  pin(key, roleId){
    if(!this.win) return;
    const r = roleById(roleId);
    if(!r){ this.close(); return; }
    /* a conversation key, never a persona id — those stopped being the same
       thing when conversations became their own objects */
    this.convId = (key && convs[key]) ? key : (convForRole(roleId) || makeConv(roleId).id);
    this.roleId = roleId;
    const d = deptOf(r);
    this.els.doc.title = r.title + " — " + state.company;
    this.els.doc.body.style.setProperty("--accent", state.accent);
    this.els.doc.body.style.setProperty("--tint", d.tint);
    this.els.doc.body.classList.toggle("dark", state.appearance === "dark");
    this.els.avatar.innerHTML = avatarSVG(r, "", 30);
    this.els.title.textContent = r.title;
    this.els.dept.textContent = d.name;
    this.els.input.placeholder = "Message " + r.title;
    this.render();
  },
  retheme(){ if(this.win) this.pin(this.convId, this.roleId); },
  close(){ const w = this.win; this._closed(); if(w){ try{ w.close(); }catch(e){} } },
  _closed(){
    if(this.dict && dictTarget === this.dict){ discardDictation(); dictTarget = mainDict; }
    this.win = null; this.convId = null; this.roleId = null; this.els = null; this.dict = null;
    this.collapsed = false; this.missed = 0;
    refreshPipBtn();
  },
  _syncInput(){
    if(!this.win) return;
    const el = this.els.input;
    el.style.height = "34px";
    el.style.height = Math.min(el.scrollHeight, 96) + "px";
    this.refreshSend();
  },
  send(){
    if(!this.win) return;
    const r = roleById(this.roleId);
    if(r && buildPrompt(r).missing.length){
      this.flashNotice("This persona's brief is incomplete — finish it in the main window first.");
      return;
    }
    const el = this.els.input;
    sendTo(this.convId, this.roleId, el.value, { input: el, reset: () => { el.style.height = "34px"; } });
    this.els.thread.scrollTop = this.els.thread.scrollHeight;
  },
  flashNotice(msg){
    if(!this.win) return;
    const n = this.els.notice;
    n.textContent = msg;
    n.hidden = false;
    clearTimeout(this._nT);
    this._nT = setTimeout(() => { n.hidden = true; }, 4000);
  },
  refreshSend(){
    if(!this.win) return;
    const busy = pending.has(this.convId);
    const s = this.els.send;
    s.classList.toggle("stop", busy);
    s.classList.toggle("primary", !busy);
    this.els.sendIco.hidden = busy;
    this.els.stopIco.hidden = !busy;
    s.disabled = busy ? false : !this.els.input.value.trim();
    s.setAttribute("aria-label", busy ? "Stop this answer" : "Send");
  },
  render(){
    if(!this.win) return;
    const box = this.els.thread;
    const t = threads[this.convId] || [];
    const speakers = castOf(this.convId).length > 1;
    const wasAt = box.scrollTop;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = (t.length || pending.has(this.convId))
      ? t.map(m => msgHTML(m, { speakers })).join("") +
        (pending.has(this.convId) ? `<div class="msg from"><div class="dots"><i></i><i></i><i></i></div></div>` : "")
      : `<div class="empty">This window stays pinned to this persona, even while the main app browses others. Ask something below.</div>`;
    box.scrollTop = nearBottom ? box.scrollHeight : wasAt;
    this.refreshSend();
  },
  /* called after every completed answer, success or failure */
  onAnswer(key){
    if(!this.win || key !== this.convId) return;
    if(this.collapsed){
      this.missed++;
      this.els.count.textContent = this.missed;
      this.setCollapsed(false);          // auto-expand when a new answer lands
    }else{
      this.render();
    }
  },
  setCollapsed(on){
    if(!this.win) return;
    this.collapsed = on;
    if(on){ this.missed = 0; this.els.count.textContent = "0"; }
    this.els.doc.body.classList.toggle("collapsed", on);
    this.els.collapse.innerHTML = on
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>`;
    this.els.collapse.title = on ? "Expand" : "Collapse";
    this.els.collapse.setAttribute("aria-label", this.els.collapse.title);
    /* resizeTo needs a user gesture; an auto-expand without one keeps the
       current window size, which still shows the full thread */
    try{ this.win.resizeTo(on ? 300 : 380, on ? 170 : 560); }catch(e){}
    if(!on) this.render();
  },
  async copyLast(){
    if(!this.win) return;

};
