<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- The app's AI mark at its resting signature — voiceprint("mark", 0) —
       in the default accent on the graphite shell. Referenced by index.html
       as the nav mark and the favicon; keep the geometry in step with
       avatarSVG() there. No gradients or url(#id) refs on purpose. -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#1D1D1F" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <rect x="6" y="6" width="88" height="44" rx="26" fill="#FFFFFF" opacity=".07"/>
  <g fill="#0A84FF">
    <rect x="15" y="31" width="10" height="38" rx="5"/>
    <rect x="30" y="28" width="10" height="44" rx="5"/>
    <rect x="45" y="17" width="10" height="66" rx="5"/>
    <rect x="60" y="28" width="10" height="44" rx="5"/>
    <rect x="75" y="31" width="10" height="38" rx="5"/>
  </g>
</svg>
